<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FREDO — clip preview</title>
<style>
  :root { --cyan: #55ddea; --bg: #02070d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: #cfeaf2; }
  #app { position: fixed; inset: 0; }

  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px; max-width: 320px;
  }
  .panel {
    background: rgba(3, 14, 20, 0.82);
    border: 1px solid rgba(85, 221, 234, 0.22);
    border-radius: 8px; padding: 10px 12px;
    backdrop-filter: blur(6px);
  }
  .title { font-size: 11px; letter-spacing: .18em; color: #6fa8b8; margin-bottom: 8px; }
  .clips { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit; font-size: 11px; cursor: pointer;
    background: rgba(85, 221, 234, 0.07);
    color: #a9d9e4; border: 1px solid rgba(85, 221, 234, 0.28);
    border-radius: 5px; padding: 5px 8px; transition: all .12s;
  }
  button:hover { background: rgba(85, 221, 234, 0.16); color: #e6fbff; }
  button.active {
    background: rgba(85, 221, 234, 0.28);
    border-color: var(--cyan); color: #fff;
    box-shadow: 0 0 12px rgba(85, 221, 234, 0.45);
  }
  .meta { font-size: 11px; color: #6fa8b8; line-height: 1.6; }
  .meta b { color: var(--cyan); font-weight: 600; }

  /* zoom control */
  .zoom { display: flex; align-items: center; gap: 8px; }
  .zoom input[type="range"] {
    flex: 1; min-width: 0; height: 3px; appearance: none; -webkit-appearance: none;
    background: rgba(85, 221, 234, 0.22); border-radius: 2px; outline: none;
  }
  .zoom input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--cyan); cursor: pointer;
    box-shadow: 0 0 8px rgba(85, 221, 234, 0.7);
  }
  .zoom input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%;
    background: var(--cyan); cursor: pointer;
  }
  .zoom input[type="number"] {
    width: 64px; font: inherit; font-size: 11px; padding: 4px 6px;
    background: rgba(85, 221, 234, 0.07); color: #dff8ff;
    border: 1px solid rgba(85, 221, 234, 0.28); border-radius: 5px;
    outline: none;
  }
  .zoom input[type="number"]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(85, 221, 234, 0.35);
  }
  .zoom .unit { font-size: 10px; color: #6fa8b8; }

  /* colour controls */
  .swatches { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .swatch {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.18); background: transparent;
    box-shadow: none; transition: transform .12s, box-shadow .12s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active {
    box-shadow: 0 0 0 2px rgba(2, 7, 13, 1), 0 0 0 3px rgba(255, 255, 255, 0.75);
  }
  #colorPicker {
    width: 26px; height: 22px; padding: 0; border: 1px solid rgba(85, 221, 234, 0.28);
    border-radius: 5px; background: transparent; cursor: pointer;
  }
  #tintLabel { font-size: 10px; color: #6fa8b8; letter-spacing: .06em; }

  .matlist { display: flex; flex-direction: column; gap: 4px; margin-top: 9px; }
  .matrow {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; font-size: 10px; color: #8fc2d0;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .matrow input[type="color"] {
    width: 36px; height: 18px; padding: 0; cursor: pointer;
    border: 1px solid rgba(85, 221, 234, 0.28); border-radius: 4px;
    background: transparent;
  }
  #status { position: fixed; inset: 0; display: grid; place-items: center;
            font-size: 13px; color: #6fa8b8; z-index: 20; pointer-events: none; }
  #status.hidden { display: none; }
  kbd { border: 1px solid rgba(85,221,234,.3); border-radius: 3px;
        padding: 0 4px; font-size: 10px; color: #9fd3df; }

  /* secret doom mode — chibi Doom Slayer (green armour, slate helmet) */
  body.doom { --cyan: #7ecb2a; --bg: #04070a; }
  body.doom .panel {
    border-color: rgba(126, 203, 42, 0.32);
    background: rgba(8, 12, 6, 0.86);
  }
  body.doom .title, body.doom .meta, body.doom .matrow { color: #93b06a; }
  body.doom button { border-color: rgba(126, 203, 42, 0.32); color: #cfe2a8; }
  body.doom button.active {
    background: rgba(126, 203, 42, 0.25);
    border-color: #7ecb2a;
    box-shadow: 0 0 12px rgba(126, 203, 42, 0.45);
  }
  body.doom kbd { border-color: rgba(126,203,42,.35); color: #cfe2a8; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status">loading fredo-character.glb…</div>

<div id="hud">
  <div class="panel">
    <div class="title">CLIPS</div>
    <div class="clips" id="clips"></div>
  </div>
  <div class="panel">
    <div class="title">VIEW</div>
    <div class="clips" id="views"></div>
  </div>
  <div class="panel">
    <div class="title">ZOOM</div>
    <div class="zoom">
      <input type="range" id="zoomRange" min="0.8" max="8" step="0.01" value="3.07" />
      <input type="number" id="zoomNumber" min="0.8" max="8" step="0.01" value="3.07" />
      <span class="unit">m</span>
    </div>
  </div>
  <div class="panel">
    <div class="title">COLOUR</div>
    <div class="swatches" id="swatches">
      <input type="color" id="colorPicker" value="#55ddea" title="custom colour" />
      <span id="tintLabel">#55DDEA</span>
    </div>
    <div class="matlist" id="matlist"></div>
  </div>
  <div class="panel meta" id="meta">
    <b id="clipName">—</b> <span id="clipTime"></span><br />
    <span id="stats"></span>
  </div>
  <div class="panel meta">
    drag = orbit · scroll = zoom<br />
    <kbd>1</kbd>–<kbd>9</kbd> <kbd>0</kbd> pick clip · <kbd>space</kbd> pause<br />
    <span class="hint">type <kbd>doom</kbd> · <kbd>esc</kbd> to leave</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/apps/ui/node_modules/three/build/three.module.js",
    "three/addons/": "/apps/ui/node_modules/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const statusEl = document.getElementById('status');
const clipsEl = document.getElementById('clips');
const clipNameEl = document.getElementById('clipName');
const clipTimeEl = document.getElementById('clipTime');
const statsEl = document.getElementById('stats');

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.38;   // ~1/3 of the previous 1.15
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02070d);
scene.fog = new THREE.Fog(0x02070d, 6, 16);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.9, 1.35, 2.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.92, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.8;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.62;
controls.update();

// ---------------------------------------------------------------- camera views
const VIEWS = {
  'front':    { pos: [0.00, 1.02,  2.95], tgt: [0, 0.90, 0] },
  '3/4':      { pos: [2.05, 1.32,  2.15], tgt: [0, 0.90, 0] },
  'side':     { pos: [2.95, 1.02,  0.05], tgt: [0, 0.90, 0] },
  'back':     { pos: [0.00, 1.02, -2.95], tgt: [0, 0.90, 0] },
  'low':      { pos: [1.15, 0.42,  2.55], tgt: [0, 0.95, 0] },
  'high':     { pos: [0.80, 2.55,  2.30], tgt: [0, 0.85, 0] },
};
const viewsEl = document.getElementById('views');
let tween = null;

function setView(key) {
  const v = VIEWS[key];
  if (!v) return;
  tween = {
    pos: new THREE.Vector3(...v.pos),
    tgt: new THREE.Vector3(...v.tgt),
  };
  for (const b of viewsEl.children) b.classList.toggle('active', b.dataset.view === key);
}

for (const key of Object.keys(VIEWS)) {
  const b = document.createElement('button');
  b.textContent = key;
  b.dataset.view = key;
  b.onclick = () => setView(key);
  viewsEl.appendChild(b);
}

// dragging cancels an in-flight view tween
controls.addEventListener('start', () => { tween = null; });

// ---------------------------------------------------------------- zoom control
const zoomRange = document.getElementById('zoomRange');
const zoomNumber = document.getElementById('zoomNumber');
const MIN_DIST = controls.minDistance;
const MAX_DIST = controls.maxDistance;
const _dir = new THREE.Vector3();

function currentDistance() {
  return camera.position.distanceTo(controls.target);
}

function clampDistance(d) {
  return Math.min(MAX_DIST, Math.max(MIN_DIST, d));
}

/** Move the camera to an exact distance from the orbit target, keeping the angle. */
function applyZoom(distance) {
  const d = clampDistance(distance);
  _dir.subVectors(camera.position, controls.target);
  if (_dir.lengthSq() < 1e-9) _dir.set(0, 0, 1);
  _dir.normalize();
  camera.position.copy(controls.target).addScaledVector(_dir, d);
  controls.update();
  return d;
}

/** Reflect the live camera distance in both inputs (wheel/drag included). */
function syncZoom() {
  const d = currentDistance();
  zoomRange.value = d.toFixed(2);
  if (document.activeElement !== zoomNumber) zoomNumber.value = d.toFixed(2);
}

zoomRange.addEventListener('input', () => {
  tween = null;
  const d = applyZoom(parseFloat(zoomRange.value));
  zoomNumber.value = d.toFixed(2);
});

function commitZoomNumber() {
  const v = parseFloat(zoomNumber.value);
  if (!Number.isFinite(v)) {
    zoomNumber.value = currentDistance().toFixed(2);
    return;
  }
  tween = null;
  const d = applyZoom(v);
  zoomNumber.value = d.toFixed(2);
  zoomRange.value = d.toFixed(2);
}
zoomNumber.addEventListener('change', commitZoomNumber);
zoomNumber.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); commitZoomNumber(); zoomNumber.blur(); }
  if (e.key === 'Escape') { zoomNumber.value = currentDistance().toFixed(2); zoomNumber.blur(); }
});

// ---------------------------------------------------------------- colour
// Every object group is its own material, so each can be coloured independently.
// Body + accent ship neutral (user tint); wardrobe/effects ship their own colour.
const PRESET_COLOURS = ['#55ddea', '#e8f7ff', '#ffb544', '#c07bff', '#5ce88a'];
const swatchesEl = document.getElementById('swatches');
const colorPicker = document.getElementById('colorPicker');
const tintLabel = document.getElementById('tintLabel');
const matlistEl = document.getElementById('matlist');
const matByName = new Map();
let bodyTint = PRESET_COLOURS[0];

function setMatColor(name, hex) {
  const m = matByName.get(name);
  if (!m) return;
  const c = new THREE.Color(hex);
  if (m.color) m.color.copy(c);
  if (m.emissive) m.emissive.copy(c);
  const inp = matlistEl.querySelector(`input[data-mat="${name}"]`);
  if (inp && inp.value.toLowerCase() !== hex.toLowerCase()) inp.value = hex;
}

function applyBodyTint(hex) {
  bodyTint = hex;
  for (const n of ['fredo_body', 'fredo_accent', 'fredo_limb', 'fredo_boot']) {
    setMatColor(n, hex);
  }
  tintLabel.textContent = hex.toUpperCase();
  colorPicker.value = hex;
  for (const b of swatchesEl.querySelectorAll('.swatch')) {
    b.classList.toggle('active', b.dataset.colour === hex.toLowerCase());
  }
}

for (const hex of PRESET_COLOURS) {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.dataset.colour = hex;
  b.style.background = hex;
  b.title = hex;
  b.onclick = () => applyBodyTint(hex);
  swatchesEl.insertBefore(b, swatchesEl.firstChild);
}
colorPicker.addEventListener('input', () => applyBodyTint(colorPicker.value));

function buildMaterialControls(materials) {
  for (const m of materials) matByName.set(m.name, m);
  matlistEl.innerHTML = '';
  for (const m of materials) {
    const row = document.createElement('div');
    row.className = 'matrow';
    const label = document.createElement('span');
    label.textContent = m.name.replace(/^fredo_/, '');
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.dataset.mat = m.name;
    inp.value = '#' + (m.color ? m.color.getHexString() : 'ffffff');
    inp.oninput = () => setMatColor(m.name, inp.value);
    row.append(label, inp);
    matlistEl.appendChild(row);
  }
}

// ---------------------------------------------------------------- secret doom mode
// Type "doom" to trigger, Esc to leave. Palette swaps are pure runtime colour,
// so the asset itself stays neutral.
const DOOM_PALETTE = {
  fredo_body:   '#3f6a1e',
  fredo_accent: '#8ec63f',
  fredo_hat:    '#2a2f1c',
  fredo_metal:  '#2a2d30',
  fredo_fx:     '#ff8a2a',
  fredo_hair:   '#cfcab8',
  fredo_doom:   '#6bb81e',
  fredo_helm:   '#4d5766',
  fredo_visor:  '#2eb84d',
  fredo_lava:   '#d92b0c',
  fredo_limb:   '#e8b48c',
  fredo_boot:   '#4d5766',
  fredo_trim:   '#2a2d30',
  fredo_glove:  '#0b0c10',
  fredo_skin:   '#e8b48c',
  fredo_wood:   '#4a2c14',
  fredo_brass:  '#a8791f',
};
let doom = false;
let savedPalette = null;

function setPalette(map) {
  for (const [name, hex] of Object.entries(map)) setMatColor(name, hex);
}

function enterDoom() {
  if (doom || !actions['doom-in']) return;
  doom = true;
  savedPalette = {};
  for (const [name, m] of matByName) {
    savedPalette[name] = '#' + (m.color ? m.color.getHexString() : 'ffffff');
  }
  setPalette(DOOM_PALETTE);
  document.body.classList.add('doom');
  play('doom-in');
}

function exitDoom() {
  if (!doom || !actions['doom-out']) return;
  doom = false;
  document.body.classList.remove('doom');
  play('doom-out');
}

const SECRET = 'doom';
let buffer = '';
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { exitDoom(); return; }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    buffer = (buffer + e.key.toLowerCase()).slice(-SECRET.length);
    if (buffer === SECRET) { buffer = ''; enterDoom(); }
  }
});

// ---------------------------------------------------------------- light
scene.add(new THREE.HemisphereLight(0x2a6f86, 0x03080c, 0.5));
const key = new THREE.DirectionalLight(0xbfe9ff, 0.9);
key.position.set(-2, 3.4, 2.6);
scene.add(key);
const rim = new THREE.DirectionalLight(0x39c6e0, 0.7);
rim.position.set(2.6, 1.6, -2.4);
scene.add(rim);

// ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4.2, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x040c12, roughness: 0.95, metalness: 0 })
);
ground.position.y = -0.002;
scene.add(ground);

const grid = new THREE.GridHelper(8.4, 21, 0x14343f, 0x0b1f27);
grid.position.y = 0;
scene.add(grid);

// ---------------------------------------------------------------- post (bloom)
let composer = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.55, 0.62
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('bloom unavailable, falling back to direct render', err);
  composer = null;
}

// ---------------------------------------------------------------- load
const loader = new GLTFLoader();
let mixer = null, model = null;
const actions = {};
let current = null, activeName = '';
let paused = false;

loader.load('./fredo-character.glb', (gltf) => {
  model = gltf.scene;
  const mats = new Set();
  model.traverse((o) => {
    if (o.isMesh && o.material) {
      (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => mats.add(m));
      o.frustumCulled = false;
    }
  });
  buildMaterialControls([...mats]);
  applyBodyTint(bodyTint);
  scene.add(model);

  mixer = new THREE.AnimationMixer(model);
  for (const clip of gltf.animations) {
    actions[clip.name] = mixer.clipAction(clip);
  }

  // remember which clips are one-shots
  const ONE_SHOT = new Set(['teleport-out', 'teleport-in', 'doom-in', 'doom-out']);
  for (const name of Object.keys(actions)) {
    if (ONE_SHOT.has(name)) {
      actions[name].setLoop(THREE.LoopOnce, 1);
      actions[name].clampWhenFinished = true;
    }
  }

  mixer.addEventListener('finished', (e) => {
    if (e.action === actions['teleport-out'] || e.action === actions['teleport-in']) {
      play(doom ? 'doom-idle' : 'idle');
    } else if (e.action === actions['doom-in']) {
      play('doom-idle');
    } else if (e.action === actions['doom-out']) {
      if (savedPalette) { setPalette(savedPalette); savedPalette = null; }
      play('idle');
    }
  });

  const names = Object.keys(actions).sort();
  names.forEach((name, i) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.dataset.clip = name;
    b.onclick = () => play(name);
    if (i < 10) b.title = `key ${(i + 1) % 10}`;
    clipsEl.appendChild(b);
  });

  const oneMesh = gltf.scene.getObjectByProperty('isSkinnedMesh', true);
  const triCount = oneMesh ? oneMesh.geometry.index.count / 3 : 0;
  statsEl.innerHTML =
    `${gltf.animations.length} clips · ${Math.round(triCount).toLocaleString()} tris · ` +
    `${gltf.animations[0] ? gltf.animations[0].duration.toFixed(2) : 0}s loops`;

  play('idle');
  statusEl.classList.add('hidden');
}, (xhr) => {
  if (xhr.total) statusEl.textContent =
    `loading fredo-character.glb… ${Math.round(xhr.loaded / xhr.total * 100)}%`;
}, (err) => {
  statusEl.textContent = 'failed to load fredo-character.glb — see console';
  console.error(err);
});

// ---------------------------------------------------------------- playback
function play(name) {
  const next = actions[name];
  if (!next || next === current) return;
  next.reset();
  next.enabled = true;
  next.setEffectiveTimeScale(1);
  next.setEffectiveWeight(1);
  next.play();
  if (current) next.crossFadeFrom(current, 0.15, false);
  current = next;
  activeName = name;
  clipNameEl.textContent = name;
  for (const b of clipsEl.children) b.classList.toggle('active', b.dataset.clip === name);
}

addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
    return;
  }
  const n = Number(e.key);
  if (!Number.isNaN(n)) {
    const names = Object.keys(actions).sort();
    const idx = n === 0 ? 9 : n - 1;
    if (names[idx]) play(names[idx]);
  }
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer && !paused) mixer.update(dt);
  if (tween) {
    const k = 1 - Math.exp(-9 * dt);          // frame-rate independent ease
    camera.position.lerp(tween.pos, k);
    controls.target.lerp(tween.tgt, k);
    if (camera.position.distanceTo(tween.pos) < 0.004) tween = null;
  }
  controls.update();
  syncZoom();
  if (current) {
    clipTimeEl.textContent = `${current.time.toFixed(2)} / ${current.getClip().duration.toFixed(2)}s`;
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
