# validate.yml — THE thorough merge gate. `validate` is the single required status
# check (branch protection). Per-stack gating happens at JOB level (not the workflow
# trigger) so this gate always emits a `validate` check run, never "Expected".
name: Validate
on:
  pull_request:
    branches: ['main', 'release/stable']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # paths — cheap discriminator (~30s) that decides which per-stack job runs (AC3).
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Expose the per-stack flags so later `needs.paths.outputs.*` conditions work.
    outputs:
      ui: ${{ steps.chk.outputs.ui }}
      rust: ${{ steps.chk.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: chk
        with:
          # ui/rust filters UNION on a stack-touching PR; a workflow change re-validates both.
          # `base` is intentionally omitted — on a pull_request event paths-filter
          # defaults to the PR's base branch, which is correct for both main PRs and
          # release/stable PRs (a hardcoded base: main would diff release PRs against main).
          filters: |
            ui:
              - 'apps/ui/**'
              # The OpenCode plugin is built by tauri.conf.json's
              # beforeDevCommand/beforeBuildCommand, so a plugin break breaks the app.
              # Real coverage: ui-validate also builds it (below).
              - 'apps/opencode-plugin/**'
              # The SERVED webview entry is `apps/tauri` (index.html → src/main.tsx,
              # served by `pnpm dev:webview` / built by `build:webview`). A change to
              # the served entry must trigger ui-validate so the served build cannot
              # break while the library-only legs stay green (ST-13, G-251).
              - 'apps/tauri/src/**'
              - 'apps/tauri/index.html'
              - 'apps/tauri/vite.config.ts'
              - 'apps/tauri/tsconfig.json'
              - 'apps/tauri/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'
            rust:
              - 'apps/tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'

  # ui-validate — thorough UI gate; NOT a required check (skipped on UI-unrelated PRs).
  ui-validate:
    needs: paths
    if: needs.paths.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # bun builds the OpenCode plugin — same SHA-pinned action as release.yml:36.
      # No other validate.yml job installs bun today.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Deterministic install (AC2). The plugin filter is REQUIRED: @fredo/ui and
      # @fredo/tauri have no dependency edge on @fredo/fredo-opencode-plugin
      # (apps/tauri/package.json:14-21, apps/ui/package.json:16-33), so the previous
      # ui+tauri filter never prepared apps/opencode-plugin/node_modules.
      - run: pnpm install --frozen-lockfile --filter @fredo/ui... --filter @fredo/tauri... --filter @fredo/fredo-opencode-plugin...
      # Real plugin coverage (AC3): the plugin build is a Tauri build hook
      # (apps/tauri/src-tauri/tauri.conf.json:7-8); a compile break must fail the gate.
      - name: Build OpenCode plugin
        run: pnpm --filter @fredo/fredo-opencode-plugin build
      - run: pnpm --filter @fredo/ui typecheck
      - run: pnpm --filter @fredo/ui build
      - run: pnpm --filter @fredo/ui test:run
      # Contrast gate (ST-6): the matrix + raw-colour enforcement, run as a named
      # step so a low-contrast change fails `ui-validate` legibly (it also runs
      # inside `test:run`). Never weakens the path filter or the required check.
      - name: Contrast gate
        run: pnpm --filter @fredo/ui contrast:gate
      # Served-entry boot guard (ST-13): build the ACTUAL webview the app loads
      # (`apps/tauri` index.html → src/main.tsx via @fredo/ui source). The library
      # legs above cannot see a served-entry-only break (e.g. a `@/…` import or a
      # missing provider mount); this leg does (G-251).
      - run: pnpm --filter @fredo/tauri build:webview

  # rust-validate — thorough Rust gate (warm-cache + nextest); NOT a required check.
  rust-validate:
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest
      - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      - run: cargo nextest run --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --locked -- -D warnings

  # validate — THE required check; always runs so it never goes "Expected" (AC2/AC3).
  # Fail-closed: a non-success `paths` result, or any leg result other than exactly
  # `success`/`skipped`, turns this check red. `if: always()` is load-bearing — without it
  # adding `paths` to `needs` would make this job skip when the discriminator fails.
  validate:
    needs: [paths, ui-validate, rust-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          UI_RESULT: ${{ needs.ui-validate.result }}
          RUST_RESULT: ${{ needs.rust-validate.result }}
        run: |
          status=0
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "::error::paths discriminator result was '$PATHS_RESULT' (expected success) - failing closed"
            status=1
          fi
          for entry in "ui-validate=$UI_RESULT" "rust-validate=$RUST_RESULT"; do
            leg="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$leg result was '$result' (only success or skipped is accepted) - failing closed"
                status=1
                ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "All checks passed"
