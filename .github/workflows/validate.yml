name: Validate
on:
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ui-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --filter @fredo/ui...
      - run: pnpm --filter @fredo/ui typecheck
      - run: pnpm --filter @fredo/ui build
      - run: pnpm --filter @fredo/ui test:run

  rust-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --locked -- -D warnings

  validate:
    needs: [ui-validate, rust-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.ui-validate.result }}" = "failure" ] || [ "${{ needs.rust-validate.result }}" = "failure" ]; then
            exit 1
          fi
          echo "All checks passed"
