# validate.yml — THE thorough merge gate. `validate` is the single required status
# check (branch protection). Per-stack gating happens at JOB level (not the workflow
# trigger) so this gate always emits a `validate` check run, never "Expected".
name: Validate
on:
  pull_request:
    branches: ['main', 'release/stable']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # paths — cheap discriminator (~30s) that decides which per-stack job runs (AC3).
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Expose the per-stack flags so later `needs.paths.outputs.*` conditions work.
    outputs:
      ui: ${{ steps.chk.outputs.ui }}
      rust: ${{ steps.chk.outputs.rust }}
      docs: ${{ steps.chk.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: chk
        with:
          # ui/rust filters UNION on a stack-touching PR; a workflow change re-validates both.
          # `base` is intentionally omitted — on a pull_request event paths-filter
          # defaults to the PR's base branch, which is correct for both main PRs and
          # release/stable PRs (a hardcoded base: main would diff release PRs against main).
          filters: |
            ui:
              - 'apps/ui/**'
              # The OpenCode plugin is built by tauri.conf.json's
              # beforeDevCommand/beforeBuildCommand, so a plugin break breaks the app.
              # Real coverage: ui-validate also builds it (below).
              - 'apps/opencode-plugin/**'
              # The SERVED webview entry is `apps/tauri` (index.html → src/main.tsx,
              # served by `pnpm dev:webview` / built by `build:webview`). A change to
              # the served entry must trigger ui-validate so the served build cannot
              # break while the library-only legs stay green (ST-13, G-251).
              - 'apps/tauri/src/**'
              - 'apps/tauri/index.html'
              - 'apps/tauri/vite.config.ts'
              - 'apps/tauri/tsconfig.json'
              - 'apps/tauri/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'
            rust:
              - 'apps/tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'
            # Documentation and the durable test-suite prose (Spec #3153). The
            # scanned roots of the prose absence guard: a docs-only PR must run the
            # guard instead of passing with nothing evaluated (CI_GATE_CONTRACT.md).
            docs:
              - 'docs/**'
              - '.opencode/tests/**'
              - '.opencode/scripts/check-navigation-prose-retired.ps1'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'

  # ui-validate — thorough UI gate; NOT a required check (skipped on UI-unrelated PRs).
  ui-validate:
    needs: paths
    if: needs.paths.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # bun builds the OpenCode plugin — same SHA-pinned action as release.yml:36.
      # No other validate.yml job installs bun today.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Deterministic install (AC2). The plugin filter is REQUIRED: @fredo/ui and
      # @fredo/tauri have no dependency edge on @fredo/fredo-opencode-plugin
      # (apps/tauri/package.json:14-21, apps/ui/package.json:16-33), so the previous
      # ui+tauri filter never prepared apps/opencode-plugin/node_modules.
      - run: pnpm install --frozen-lockfile --filter @fredo/ui... --filter @fredo/tauri... --filter @fredo/fredo-opencode-plugin...
      # Real plugin coverage (AC3): the plugin build is a Tauri build hook
      # (apps/tauri/src-tauri/tauri.conf.json:7-8); a compile break must fail the gate.
      - name: Build OpenCode plugin
        run: pnpm --filter @fredo/fredo-opencode-plugin build
      - run: pnpm --filter @fredo/ui typecheck
      - run: pnpm --filter @fredo/ui build
      - run: pnpm --filter @fredo/ui test:run
      # Contrast gate (ST-6): the matrix + raw-colour enforcement, run as a named
      # step so a low-contrast change fails `ui-validate` legibly (it also runs
      # inside `test:run`). Never weakens the path filter or the required check.
      - name: Contrast gate
        run: pnpm --filter @fredo/ui contrast:gate
      # Served-entry boot guard (ST-13): build the ACTUAL webview the app loads
      # (`apps/tauri` index.html → src/main.tsx via @fredo/ui source). The library
      # legs above cannot see a served-entry-only break (e.g. a `@/…` import or a
      # missing provider mount); this leg does (G-251).
      - run: pnpm --filter @fredo/tauri build:webview

  # docs-validate — the documentation prose gate (Spec #3153, AC1); NOT a required
  # check (skipped on PRs that touch none of the `docs` filter paths). A docs-only
  # PR used to run NOTHING (docs/CI_GATE_CONTRACT.md); this leg closes that gap by
  # running the committed prose absence guard over `docs/` + `.opencode/tests/`.
  docs-validate:
    needs: paths
    if: needs.paths.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The guard proves the deleted keyboard-navigation vocabulary is taught by no
      # current-state document and no surviving durable suite (outside the named
      # evidence allowlist).
      - name: Navigation prose absence guard
        run: pwsh -NoProfile -File .opencode/scripts/check-navigation-prose-retired.ps1
      - name: Navigation prose absence guard (self-test)
        run: pwsh -NoProfile -File .opencode/scripts/check-navigation-prose-retired.ps1 -SelfTest

  # rust-validate — thorough Rust gate (warm-cache + nextest); NOT a required check.
  #
  # Spec #3141 ST-1: the crate now links the in-process companion engine
  # (`llama-cpp-4`), which builds llama.cpp + ggml + ggml-vulkan FROM SOURCE
  # (the crate publishes no matching prebuilt). The rust gate therefore needs
  # the native toolchain the engine compiles against:
  #   * the LunarG Vulkan SDK (ggml-vulkan's Windows CMake lookup hard-fails
  #     without it, and glslc compiles the shaders).
  # Vulkan is the ONLY GPU backend (see the `llama-cpp-4` feature list in
  # `apps/tauri/src-tauri/Cargo.toml`) — `ggml-cuda` is not compiled, so there
  # is no CUDA Toolkit step. The source build is still slow on a cold cache, so
  # the job budget stays raised and the CMake tree is cached; the checks
  # themselves are unchanged and are never weakened.
  rust-validate:
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    # Pinned to windows-2022 (VS 2022 / MSVC 14.4x). `windows-latest` now ships
    # VS 18 (MSVC 14.5x), whose STL asserts "expected Clang 22 or newer" during
    # `llama-cpp-sys-4`'s bindgen step, so `cargo check` dies in a third-party
    # header before any Fredo code compiles. The pin keeps the native toolchain
    # the engine actually builds against; it is a toolchain choice, not a
    # relaxation of any check.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      # Spec #3141 - resolve `llama-cpp-sys-4`'s CMake build cache dir.
      #
      # Its build.rs keys the expensive CMake/CUDA build tree on a hash of
      # OUT_DIR and places it OUTSIDE the cargo target dir, at
      # `%LOCALAPPDATA%\llcb\<hash>`. `Swatinem/rust-cache` only caches
      # `./target` and `~/.cargo`, so without this the C++/CUDA compile was
      # redone on EVERY run (measured: `cargo check` took 94m 32s on a cold
      # run). The hash is stable for a given OUT_DIR string, so the directory
      # is reusable across runs on the same runner image.
      #
      # Computed in a step because the action input needs a literal path and
      # `cache-directories` entries are not shell-expanded.
      - name: Resolve the llama.cpp CMake cache dir
        id: llcb
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "llcb"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Write-Host "llama.cpp CMake cache dir: $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
          # Cache the out-of-target-dir CMake/CUDA build tree (see above).
          # ~1.2 GB per build configuration, well inside the 10 GB repo limit.
          cache-directories: ${{ steps.llcb.outputs.dir }}
          # The CMake tree is large and expensive; never throw it away because
          # the job failed - a red run should still warm the next one.
          cache-on-failure: true
      # LunarG Vulkan SDK (SHA-pinned). Exports `VULKAN_SDK` and puts glslc on PATH.
      # Spec #3141: Vulkan is the ONLY GPU backend now (ggml-cuda is not
      # compiled), so there is no CUDA Toolkit step any more — the CUDA
      # source build (71 `.cu` files through nvcc/cicc/ptxas) was the dominant
      # cost of this leg and of every local build.
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true
          # The SDK alone does not give us a loadable `vulkan-1.dll` on a
          # Windows Server runner (the loader is not in `Bin` and the Server
          # image does not carry it in System32). `ggml-vulkan.dll` imports it
          # at LOAD time, so nextest cannot enumerate a single test binary
          # without it. `install_runtime` is the action's own supported switch
          # for exactly this (it installs the runtime / `vulkan-1.dll`); the
          # discovery step below still searches every candidate and fails loud
          # if the loader is absent.
          install_runtime: true
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest
      - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      # Spec #3141 fix D4 — nextest must be able to LOAD what it enumerates.
      #
      # `llama-cpp-4` is linked with `dynamic-link`, so EVERY test binary statically
      # imports `ggml*.dll` / `llama*.dll` / `mtmd.dll`. Those land in
      # `target/debug/` (cargo's profile dir), while nextest's binaries live in
      # `target/debug/deps/`. Windows resolves an import from the EXE's own
      # directory, the system dirs, the CWD and PATH — never the PARENT profile dir —
      # so enumeration died with `0xc0000135: The specified module could not be
      # found` before a single test ran.
      #
      # ONE additive, job-scoped step: append the payload dirs to `GITHUB_PATH`
      # (which applies to every LATER step of this job only) and FAIL if no
      # `ggml*.dll` is found — a missing payload must be a named failure, never a
      # silent skip that let the build look green.
      #
      # The GPU runtime is the second half of the payload. With the Vulkan-only
      # backend (Spec #3141 re-scope) the import surface is `vulkan-1.dll` from
      # the installed SDK - there is no CUDA runtime (`cudart`/`cublas`/
      # `cublasLt`) to discover any more, so the old toolkit-major-dependent
      # directory search is gone with it.
      #
      # The loader directory is DISCOVERED across an arch-correct candidate set,
      # never named: the SDK does not keep the loader in `Bin`, so the previous
      # single hardcoded candidate (`$VULKAN_SDK\Bin`) could never match.
      - name: Put the companion engine DLLs on PATH (dynamic-link payload)
        shell: pwsh
        run: |
          $root = "apps/tauri/src-tauri/target/debug"
          $dirs = @()
          if (Test-Path -LiteralPath $root) { $dirs += (Resolve-Path -LiteralPath $root).Path }
          # The CMake output dir of the sys crate (where ggml*/llama*/mtmd DLLs are
          # copied on a dynamic-link build).
          Get-ChildItem -Path "apps/tauri/src-tauri/target/debug/build" -Directory -Filter "llama-cpp-sys-4-*" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $out = Join-Path $_.FullName "out"
              if (Test-Path -LiteralPath $out) { $dirs += (Resolve-Path -LiteralPath $out).Path }
            }
          # The sys crate's CMake build tree lives OUTSIDE `target` (see the
          # rust-cache step above: `%LOCALAPPDATA%\llcb\<hash>`, cached because
          # the C++ compile is expensive). The DLLs are staged in `<hash>\bin`.
          #
          # Why this is REQUIRED, not belt-and-braces: when rust-cache restores
          # the sys crate's fingerprint, its `build.rs` does NOT re-run, so the
          # copy into `target/debug` never happens and the only payload that
          # exists is in this cached tree. Verified from a failing CI log: the
          # build step finished green while `target\debug` held no ggml DLL.
          #
          # The hash is taken from the CURRENT build's `output` file, never by
          # globbing every `llcb\*` dir — several stale trees coexist (different
          # feature sets / CUDA-era), and putting more than one on PATH would mix
          # mismatched ggml payloads. `output` is written by the sys crate's
          # build.rs and names the exact CMake tree this build used.
          $llcbRoot = if ($env:LOCALAPPDATA) { Join-Path $env:LOCALAPPDATA "llcb" } else { $null }
          if ($llcbRoot) {
            $outFile = Get-ChildItem -Path "apps/tauri/src-tauri/target/debug/build" -Directory -Filter "llama-cpp-sys-4-*" -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "output" } |
              Where-Object { Test-Path -LiteralPath $_ } |
              Sort-Object { (Get-Item -LiteralPath $_).LastWriteTime } -Descending |
              Select-Object -First 1
            $hash = $null
            if ($outFile) {
              $hash = (Select-String -LiteralPath $outFile -Pattern "llcb[/\\]([0-9a-f]{6,})" -AllMatches |
                ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } |
                Select-Object -Unique -First 1)
              Write-Host "llcb hash from $outFile -> '$hash'"
            } else {
              # `cargo check` does not always leave build-script `output` files
              # behind (verified: a CI run reported none after a green check
              # while the cached tree existed). Fall back to the newest
              # COMPLETE Vulkan payload tree.
              Write-Host "llcb: no llama-cpp-sys-4 output file found; falling back to newest complete payload tree"
            }
            $chosen = $null
            if ($hash) {
              $bin = Join-Path $llcbRoot (Join-Path $hash "bin")
              if (Test-Path -LiteralPath (Join-Path $bin "ggml-vulkan.dll")) { $chosen = $bin }
              else { Write-Host "llcb payload candidate: $bin -> (missing or no ggml-vulkan.dll)" }
            }
            if (-not $chosen) {
              # Take ONE tree WHOLE. Never merge files from different trees: a
              # mixed ggml/llama/mtmd set is exactly the mismatched payload this
              # step exists to avoid. Completeness is gated on the full Vulkan
              # family, and the newest tree wins (the one just used by the build).
              $chosen = Get-ChildItem -LiteralPath $llcbRoot -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Join-Path $_.FullName "bin" } |
                Where-Object {
                  (Test-Path -LiteralPath (Join-Path $_ "ggml-vulkan.dll")) -and
                  (Test-Path -LiteralPath (Join-Path $_ "ggml.dll")) -and
                  (Test-Path -LiteralPath (Join-Path $_ "llama.dll"))
                } |
                Sort-Object { (Get-Item -LiteralPath (Join-Path $_ "ggml-vulkan.dll")).LastWriteTime } -Descending |
                Select-Object -First 1
            }
            if ($chosen) {
              $dirs += (Resolve-Path -LiteralPath $chosen).Path
              Write-Host "llcb payload candidate: $chosen -> complete Vulkan payload (used whole)"
            } else {
              Write-Host "llcb: no complete Vulkan payload tree found under $llcbRoot"
            }
          }
          # `vulkan-1.dll` is a LOAD-TIME import of `ggml-vulkan.dll` -- verified
          # by reading its PE import table, where `vulkan-1.dll` appears in the
          # STATIC import list (not the delay-load table). `ggml-vulkan.dll` is
          # itself a static import of `ggml.dll`, which every engine-linking test
          # binary imports, so Windows must be able to resolve the loader when
          # the binary is loaded. A miss therefore genuinely blocks enumeration
          # and must FAIL LOUD -- it is not a warning.
          #
          # The loader's directory is DISCOVERED, never named. Two independent
          # reasons the previous single candidate (`$VULKAN_SDK\Bin`) could never
          # match:
          #   1. `Bin` holds `glslc`, `vulkaninfoSDK.exe` and the layers -- the
          #      loader is not there.
          #   2. `install-vulkan-sdk-action`'s `install_runtime` input defaults to
          #      FALSE (action.yml leaves it `required: false` and inputs.ts
          #      evaluates `/true/i.test(inputInstallRuntime)`), so the copy-back
          #      into `$VULKAN_SDK\runtime\{x64,x86}` never runs on this job.
          # The loader that IS present is written by the SDK installer itself,
          # which runs `Helpers\VulkanRT.exe` and drops it into the system
          # directories. So the candidate set spans the SDK layout AND the system
          # directories, and every candidate's outcome is printed.
          # Arch-correct candidate order: the SDK's runtime copy-back layout is
          # `runtime\{x64,x86}` (installer_vulkan.ts installVulkanRuntimeFromSdk),
          # so probe the runner's own bitness first and the other second.
          # PROCESSOR_ARCHITECTURE is `AMD64` / `ARM64` / `x86`; a 64-bit runner
          # (this job) takes the x64 arm.
          $procArch = "$env:PROCESSOR_ARCHITECTURE"
          if ($procArch -eq "x86") { $archPrimary = "x86"; $archSecondary = "x64" }
          else { $archPrimary = "x64"; $archSecondary = "x86" }
          $vulkanCandidates = @()
          if ($env:VULKAN_SDK) {
            $runtimeRoot = Join-Path $env:VULKAN_SDK "runtime"
            $vulkanCandidates += (Join-Path $runtimeRoot $archPrimary)
            $vulkanCandidates += (Join-Path $runtimeRoot $archSecondary)
            $vulkanCandidates += $runtimeRoot
            # Any other arch/layout directory the installer chose (arm64, a
            # future subdir name) -- discovery must not depend on our guess.
            if (Test-Path -LiteralPath $runtimeRoot -PathType Container) {
              $vulkanCandidates += @(Get-ChildItem -LiteralPath $runtimeRoot -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            }
            $vulkanCandidates += (Join-Path $env:VULKAN_SDK "Bin")
            $vulkanCandidates += $env:VULKAN_SDK
          }
          $systemRoot = if ($env:SystemRoot) { $env:SystemRoot } else { "C:\Windows" }
          $vulkanCandidates += (Join-Path $systemRoot "System32")
          $vulkanCandidates = @($vulkanCandidates | Where-Object { $_ } | Select-Object -Unique)
          $loaderDirs = @()
          $searched = @()
          foreach ($cand in $vulkanCandidates) {
            if (-not (Test-Path -LiteralPath $cand -PathType Container)) {
              Write-Host "Vulkan loader candidate: $cand -> (directory does not exist)"
              $searched += "$cand [missing]"
              continue
            }
            $resolved = (Resolve-Path -LiteralPath $cand).Path
            $loaderHit = @(Get-ChildItem -LiteralPath $resolved -Filter "vulkan-1.dll" -File -ErrorAction SilentlyContinue)
            if ($loaderHit.Count -gt 0) {
              Write-Host "Vulkan loader candidate: $resolved -> vulkan-1.dll FOUND"
              $loaderDirs += $resolved
              $searched += "$resolved [hit]"
            } else {
              Write-Host "Vulkan loader candidate: $resolved -> (no vulkan-1.dll)"
              $searched += "$resolved [no loader]"
            }
          }
          if ($loaderDirs.Count -eq 0) {
            Write-Host "::error::vulkan-1.dll not found in any candidate directory. ggml-vulkan.dll imports it at LOAD time, so a dynamic-link test binary cannot be enumerated. Searched: $($searched -join '; ')."
            exit 1
          }
          # A discovered loader directory joins the payload set, so it is
          # published to PATH and covered by the read-back assertion below.
          foreach ($loaderDir in $loaderDirs) { $dirs += $loaderDir }
          $dirs = @($dirs | Select-Object -Unique)
          $ggml = @()
          foreach ($dir in $dirs) {
            $found = @(Get-ChildItem -LiteralPath $dir -Filter "ggml*.dll" -File -ErrorAction SilentlyContinue)
            if ($found.Count -gt 0) {
              $names = ($found | ForEach-Object { $_.Name }) -join ", "
              Write-Host "DLL dir: $dir -> $names"
              $ggml += $found
            } else {
              Write-Host "DLL dir: $dir -> (no ggml*.dll)"
            }
            # Publish to the NEXT step's PATH. `Write-Host ... | Out-File` does NOT
            # work here — Write-Host writes the information stream, so the pipe
            # receives nothing and GITHUB_PATH would stay empty (the step then
            # prints a confident summary while adding no directory at all).
            # Append the literal line instead, inserting a separator only when the
            # file does not already end with a newline.
            $ghPath = $env:GITHUB_PATH
            if ($null -eq $ghPath -or $ghPath -eq "" -or -not (Test-Path -LiteralPath $ghPath)) {
              Write-Host "::error::GITHUB_PATH is not set; this step must run inside a GitHub Actions job."
              exit 1
            }
            $existing = [System.IO.File]::ReadAllBytes($ghPath)
            $separator = if (($existing.Length -gt 0) -and ($existing[-1] -ne 10)) { [Environment]::NewLine } else { "" }
            [System.IO.File]::AppendAllText($ghPath, "$separator$dir$([Environment]::NewLine)")
          }
          if ($ggml.Count -eq 0) {
            Write-Host "::error::No ggml*.dll found. Searched: $($dirs -join '; '). A dynamic-link test binary cannot be enumerated without it."
            exit 1
          }
          # Prove the publish actually landed: a silently empty GITHUB_PATH is the
          # failure mode that made the round-4 step report success while adding
          # nothing. Read the file back and fail loud on any unpublished dir.
          $published = @(Get-Content -LiteralPath $env:GITHUB_PATH | Where-Object { $_ })
          $unpublished = @($dirs | Where-Object { $published -notcontains $_ })
          if ($unpublished.Count -gt 0) {
            Write-Host "::error::Failed to publish DLL dir(s) to GITHUB_PATH: $($unpublished -join '; '). Published: $($published -join '; ')."
            exit 1
          }
          # Fail LOUD on the Vulkan loader too: a miss is a named failure, never a
          # warning, so a green enumeration always means the payload is genuinely
          # loadable (a false green is what shipped the round-4 red). The loader
          # dir(s) discovered above were folded into `$dirs` BEFORE this point, so
          # this is the same publish + read-back guarantee the ggml DLLs get.
          $vulkanHits = @()
          foreach ($dir in $dirs) {
            $vulkanHits += @(Get-ChildItem -LiteralPath $dir -Filter "vulkan-1.dll" -File -ErrorAction SilentlyContinue)
          }
          if ($vulkanHits.Count -eq 0) {
            Write-Host "::error::vulkan-1.dll not found (searched: $($dirs -join '; ')); ggml-vulkan.dll imports it at LOAD time and the test binaries cannot be enumerated."
            exit 1
          }
          $vulkanNames = ($vulkanHits | ForEach-Object { $_.Name }) -join ", "
          Write-Host "Vulkan loader: vulkan-1.dll -> $($vulkanHits.Count) match(es): $vulkanNames"
          Write-Host "Vulkan loader dir(s) on PATH: $($loaderDirs -join '; ')"
          Write-Host "Companion engine DLL payload: $($ggml.Count) ggml DLL(s) + Vulkan loader; $($published.Count) dir(s) published to GITHUB_PATH."
      # Spec #3141 - run the `live` nextest profile, not the fast default.
      #
      # The default profile SKIPS the model-loading modules
      # (`llm_server::engine::mtp_tests` + `llm_server::engine::integration`)
      # for fast local iteration - those tests load the real 2.44 GB GGUF trio
      # and take 183-1141 s EACH. A CI runner has no models, so on CI those
      # tests take the named-skip path anyway; `live` keeps the gate's intent
      # (the full suite is enumerated and any genuine model-independent
      # regression in those modules still fails) while remaining honest about
      # what did and did not execute. See `apps/tauri/src-tauri/.config/nextest.toml`.
      - run: cargo nextest run --manifest-path apps/tauri/src-tauri/Cargo.toml --locked --profile live
      - run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --locked -- -D warnings

  # release-version-guard — a release PR may not carry version content `main` lacks.
  #
  # WHY THIS EXISTS
  # ---------------
  # The documented release flow (`docs/release-process.md` Step 5) is ONE-DIRECTIONAL:
  # a release PR "brings `main` into `release/stable`", and a release sync sets the
  # `release/stable` tree to EXACTLY `main` (the pattern `ced8d7a` / `03efd0e` used).
  # So `main` is the source of truth for the version, and anything present ONLY on
  # `release/stable` is transient: the next sync overwrites it with `main`'s content.
  #
  # That is what made PR #3156 a silent trap: it bumped the version to 0.2.0 on
  # `release/stable` while `main` stayed on 0.1.0. The release that shipped was
  # correct, but the NEXT sync would have reset the tree to `main`, silently
  # rebuilding 0.1.0 and reusing the old tag. No check caught it; it took a manual
  # post-release comparison.
  #
  # THE RULE (deliberately one rule, no heuristics):
  #   On a PR into `release/stable`, every version-bearing file's content at the PR
  #   head must EQUAL `main`'s content. That is exactly "this release brings main".
  #   A PR that adds version content main does not have fails.
  #
  #   On a PR into `main` this job is a no-op: `main` is the source of truth, so a
  #   main PR legitimately moves the version and the release line catches up at the
  #   next sync. Failing it here would block the correct order of operations.
  #
  # No false positives: the normal release flow (main -> release/stable) has
  # `pr == main` by construction, so it passes without any escape hatch.
  release-version-guard:
    needs: paths
    if: always() && needs.paths.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Assert a release PR brings main's version content
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          FILES=(
            "apps/tauri/src-tauri/tauri.conf.json"
            "apps/tauri/src-tauri/Cargo.toml"
            "apps/tauri/src-tauri/Cargo.lock"
            "apps/tauri/package.json"
            "apps/ui/package.json"
          )

          if [ "$BASE_REF" != "release/stable" ]; then
            echo "Base is '$BASE_REF', not release/stable — main is the source of truth,"
            echo "so the version guard does not apply here. The release line catches up"
            echo "at the next release/stable sync."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin main "+${HEAD_SHA}:refs/pr/head" >/dev/null 2>&1 \
            || { echo "::error::could not fetch main and the PR head"; exit 1; }

          status=0
          for f in "${FILES[@]}"; do
            m="$(git show "origin/main:$f" 2>/dev/null || echo "__ABSENT__")"
            p="$(git show "refs/pr/head:$f" 2>/dev/null || echo "__ABSENT__")"

            if [ "$m" = "$p" ]; then
              echo "OK    $f — matches main"
              continue
            fi

            echo "::error file=$f::This release PR carries content for '$f' that main does not have. The documented flow is main -> release/stable, and a release sync sets the tree to exactly main — so this change would be silently reverted by the next sync. Land it on main first, then sync."
            status=1
          done

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "A release PR must bring main's version content, not introduce its own."
            echo "Correct order: (1) the change lands on main, (2) sync main -> release/stable."
            echo "See docs/release-process.md Step 5."
            exit 1
          fi
          echo "Version invariant holds: this release PR brings main's version content."

  # validate — THE required check; always runs so it never goes "Expected" (AC2/AC3).
  # Fail-closed: a non-success `paths` result, or any leg result other than exactly
  # `success`/`skipped`, turns this check red. `if: always()` is load-bearing — without it
  # adding `paths` to `needs` would make this job skip when the discriminator fails.
  validate:
    needs: [paths, ui-validate, rust-validate, docs-validate, release-version-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          UI_RESULT: ${{ needs.ui-validate.result }}
          RUST_RESULT: ${{ needs.rust-validate.result }}
          DOCS_RESULT: ${{ needs.docs-validate.result }}
          VERSION_GUARD_RESULT: ${{ needs.release-version-guard.result }}
        run: |
          status=0
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "::error::paths discriminator result was '$PATHS_RESULT' (expected success) - failing closed"
            status=1
          fi
          for entry in "ui-validate=$UI_RESULT" "rust-validate=$RUST_RESULT" "docs-validate=$DOCS_RESULT" "release-version-guard=$VERSION_GUARD_RESULT"; do
            leg="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$leg result was '$result' (only success or skipped is accepted) - failing closed"
                status=1
                ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "All checks passed"
