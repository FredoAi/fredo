# validate.yml — THE thorough merge gate. `validate` is the single required status
# check (branch protection). Per-stack gating happens at JOB level (not the workflow
# trigger) so this gate always emits a `validate` check run, never "Expected".
name: Validate
on:
  pull_request:
    branches: ['main', 'release/stable']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # paths — cheap discriminator (~30s) that decides which per-stack job runs (AC3).
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Expose the per-stack flags so later `needs.paths.outputs.*` conditions work.
    outputs:
      ui: ${{ steps.chk.outputs.ui }}
      rust: ${{ steps.chk.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: chk
        with:
          # ui/rust filters UNION on a stack-touching PR; a workflow change re-validates both.
          # `base` is intentionally omitted — on a pull_request event paths-filter
          # defaults to the PR's base branch, which is correct for both main PRs and
          # release/stable PRs (a hardcoded base: main would diff release PRs against main).
          filters: |
            ui:
              - 'apps/ui/**'
              # The OpenCode plugin is built by tauri.conf.json's
              # beforeDevCommand/beforeBuildCommand, so a plugin break breaks the app.
              # Real coverage: ui-validate also builds it (below).
              - 'apps/opencode-plugin/**'
              # The SERVED webview entry is `apps/tauri` (index.html → src/main.tsx,
              # served by `pnpm dev:webview` / built by `build:webview`). A change to
              # the served entry must trigger ui-validate so the served build cannot
              # break while the library-only legs stay green (ST-13, G-251).
              - 'apps/tauri/src/**'
              - 'apps/tauri/index.html'
              - 'apps/tauri/vite.config.ts'
              - 'apps/tauri/tsconfig.json'
              - 'apps/tauri/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'
            rust:
              - 'apps/tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'

  # ui-validate — thorough UI gate; NOT a required check (skipped on UI-unrelated PRs).
  ui-validate:
    needs: paths
    if: needs.paths.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # bun builds the OpenCode plugin — same SHA-pinned action as release.yml:36.
      # No other validate.yml job installs bun today.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Deterministic install (AC2). The plugin filter is REQUIRED: @fredo/ui and
      # @fredo/tauri have no dependency edge on @fredo/fredo-opencode-plugin
      # (apps/tauri/package.json:14-21, apps/ui/package.json:16-33), so the previous
      # ui+tauri filter never prepared apps/opencode-plugin/node_modules.
      - run: pnpm install --frozen-lockfile --filter @fredo/ui... --filter @fredo/tauri... --filter @fredo/fredo-opencode-plugin...
      # Real plugin coverage (AC3): the plugin build is a Tauri build hook
      # (apps/tauri/src-tauri/tauri.conf.json:7-8); a compile break must fail the gate.
      - name: Build OpenCode plugin
        run: pnpm --filter @fredo/fredo-opencode-plugin build
      - run: pnpm --filter @fredo/ui typecheck
      - run: pnpm --filter @fredo/ui build
      - run: pnpm --filter @fredo/ui test:run
      # Contrast gate (ST-6): the matrix + raw-colour enforcement, run as a named
      # step so a low-contrast change fails `ui-validate` legibly (it also runs
      # inside `test:run`). Never weakens the path filter or the required check.
      - name: Contrast gate
        run: pnpm --filter @fredo/ui contrast:gate
      # Served-entry boot guard (ST-13): build the ACTUAL webview the app loads
      # (`apps/tauri` index.html → src/main.tsx via @fredo/ui source). The library
      # legs above cannot see a served-entry-only break (e.g. a `@/…` import or a
      # missing provider mount); this leg does (G-251).
      - run: pnpm --filter @fredo/tauri build:webview

  # rust-validate — thorough Rust gate (warm-cache + nextest); NOT a required check.
  #
  # Spec #3141 ST-1: the crate now links the in-process companion engine
  # (`llama-cpp-4`), which builds llama.cpp + ggml + ggml-vulkan FROM SOURCE
  # (the crate publishes no matching prebuilt). The rust gate therefore needs
  # the native toolchain the engine compiles against:
  #   * the LunarG Vulkan SDK (ggml-vulkan's Windows CMake lookup hard-fails
  #     without it, and glslc compiles the shaders).
  # Vulkan is the ONLY GPU backend (see the `llama-cpp-4` feature list in
  # `apps/tauri/src-tauri/Cargo.toml`) — `ggml-cuda` is not compiled, so there
  # is no CUDA Toolkit step. The source build is still slow on a cold cache, so
  # the job budget stays raised and the CMake tree is cached; the checks
  # themselves are unchanged and are never weakened.
  rust-validate:
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      # Spec #3141 - resolve `llama-cpp-sys-4`'s CMake build cache dir.
      #
      # Its build.rs keys the expensive CMake/CUDA build tree on a hash of
      # OUT_DIR and places it OUTSIDE the cargo target dir, at
      # `%LOCALAPPDATA%\llcb\<hash>`. `Swatinem/rust-cache` only caches
      # `./target` and `~/.cargo`, so without this the C++/CUDA compile was
      # redone on EVERY run (measured: `cargo check` took 94m 32s on a cold
      # run). The hash is stable for a given OUT_DIR string, so the directory
      # is reusable across runs on the same runner image.
      #
      # Computed in a step because the action input needs a literal path and
      # `cache-directories` entries are not shell-expanded.
      - name: Resolve the llama.cpp CMake cache dir
        id: llcb
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "llcb"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Write-Host "llama.cpp CMake cache dir: $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
          # Cache the out-of-target-dir CMake/CUDA build tree (see above).
          # ~1.2 GB per build configuration, well inside the 10 GB repo limit.
          cache-directories: ${{ steps.llcb.outputs.dir }}
          # The CMake tree is large and expensive; never throw it away because
          # the job failed - a red run should still warm the next one.
          cache-on-failure: true
      # LunarG Vulkan SDK (SHA-pinned). Exports `VULKAN_SDK` and puts glslc on PATH.
      # Spec #3141: Vulkan is the ONLY GPU backend now (ggml-cuda is not
      # compiled), so there is no CUDA Toolkit step any more — the CUDA
      # source build (71 `.cu` files through nvcc/cicc/ptxas) was the dominant
      # cost of this leg and of every local build.
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest
      - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      # Spec #3141 fix D4 — nextest must be able to LOAD what it enumerates.
      #
      # `llama-cpp-4` is linked with `dynamic-link`, so EVERY test binary statically
      # imports `ggml*.dll` / `llama*.dll` / `mtmd.dll`. Those land in
      # `target/debug/` (cargo's profile dir), while nextest's binaries live in
      # `target/debug/deps/`. Windows resolves an import from the EXE's own
      # directory, the system dirs, the CWD and PATH — never the PARENT profile dir —
      # so enumeration died with `0xc0000135: The specified module could not be
      # found` before a single test ran.
      #
      # ONE additive, job-scoped step: append the payload dirs to `GITHUB_PATH`
      # (which applies to every LATER step of this job only) and FAIL if no
      # `ggml*.dll` is found — a missing payload must be a named failure, never a
      # silent skip that let the build look green.
      #
      # The GPU runtime is the second half of the payload. With the Vulkan-only
      # backend (Spec #3141 re-scope) the import surface is `vulkan-1.dll` from
      # the installed SDK - there is no CUDA runtime (`cudart`/`cublas`/
      # `cublasLt`) to discover any more, so the old toolkit-major-dependent
      # directory search is gone with it.
      - name: Put the companion engine DLLs on PATH (dynamic-link payload)
        shell: pwsh
        run: |
          $root = "apps/tauri/src-tauri/target/debug"
          $dirs = @()
          if (Test-Path -LiteralPath $root) { $dirs += (Resolve-Path -LiteralPath $root).Path }
          # The CMake output dir of the sys crate (where ggml*/llama*/mtmd DLLs are
          # copied on a dynamic-link build).
          Get-ChildItem -Path "apps/tauri/src-tauri/target/debug/build" -Directory -Filter "llama-cpp-sys-4-*" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $out = Join-Path $_.FullName "out"
              if (Test-Path -LiteralPath $out) { $dirs += (Resolve-Path -LiteralPath $out).Path }
            }
          # `vulkan-1.dll` is imported by ggml-vulkan.dll and by the test
          # binaries at load time. The SDK's loader directory is discovered, not
          # named, so an SDK layout change cannot silently break enumeration.
          $vulkanSearchPaths = @()
          if ($env:VULKAN_SDK) {
            $vulkanBin = Join-Path $env:VULKAN_SDK "Bin"
            $vulkanSearchPaths += $vulkanBin
            if (Test-Path -LiteralPath $vulkanBin -PathType Container) {
              $dirs += (Resolve-Path -LiteralPath $vulkanBin).Path
            }
          }
          $dirs = @($dirs | Select-Object -Unique)
          $ggml = @()
          foreach ($dir in $dirs) {
            $found = @(Get-ChildItem -LiteralPath $dir -Filter "ggml*.dll" -File -ErrorAction SilentlyContinue)
            if ($found.Count -gt 0) {
              $names = ($found | ForEach-Object { $_.Name }) -join ", "
              Write-Host "DLL dir: $dir -> $names"
              $ggml += $found
            } else {
              Write-Host "DLL dir: $dir -> (no ggml*.dll)"
            }
            # Publish to the NEXT step's PATH. `Write-Host ... | Out-File` does NOT
            # work here — Write-Host writes the information stream, so the pipe
            # receives nothing and GITHUB_PATH would stay empty (the step then
            # prints a confident summary while adding no directory at all).
            # Append the literal line instead, inserting a separator only when the
            # file does not already end with a newline.
            $ghPath = $env:GITHUB_PATH
            if ($null -eq $ghPath -or $ghPath -eq "" -or -not (Test-Path -LiteralPath $ghPath)) {
              Write-Host "::error::GITHUB_PATH is not set; this step must run inside a GitHub Actions job."
              exit 1
            }
            $existing = [System.IO.File]::ReadAllBytes($ghPath)
            $separator = if (($existing.Length -gt 0) -and ($existing[-1] -ne 10)) { [Environment]::NewLine } else { "" }
            [System.IO.File]::AppendAllText($ghPath, "$separator$dir$([Environment]::NewLine)")
          }
          if ($ggml.Count -eq 0) {
            Write-Host "::error::No ggml*.dll found. Searched: $($dirs -join '; '). A dynamic-link test binary cannot be enumerated without it."
            exit 1
          }
          # Prove the publish actually landed: a silently empty GITHUB_PATH is the
          # failure mode that made the round-4 step report success while adding
          # nothing. Read the file back and fail loud on any unpublished dir.
          $published = @(Get-Content -LiteralPath $env:GITHUB_PATH | Where-Object { $_ })
          $unpublished = @($dirs | Where-Object { $published -notcontains $_ })
          if ($unpublished.Count -gt 0) {
            Write-Host "::error::Failed to publish DLL dir(s) to GITHUB_PATH: $($unpublished -join '; '). Published: $($published -join '; ')."
            exit 1
          }
          # Fail LOUD on the Vulkan loader too: a miss is a named failure, never a
          # warning, so a green enumeration always means the payload is genuinely
          # loadable (a false green is what shipped the round-4 red).
          $guardDirs = @(@($dirs) + @($vulkanSearchPaths) | Where-Object { $_ } | Select-Object -Unique)
          $vulkanHits = @()
          foreach ($dir in $guardDirs) {
            $vulkanHits += @(Get-ChildItem -LiteralPath $dir -Filter "vulkan-1.dll" -File -ErrorAction SilentlyContinue)
          }
          if ($vulkanHits.Count -eq 0) {
            Write-Host "::error::vulkan-1.dll not found (searched: $($guardDirs -join '; ')); the ggml-vulkan test binaries import it and cannot be enumerated."
            exit 1
          }
          $vulkanNames = ($vulkanHits | ForEach-Object { $_.Name }) -join ", "
          Write-Host "Vulkan loader: vulkan-1.dll -> $($vulkanHits.Count) match(es): $vulkanNames"
          Write-Host "Companion engine DLL payload: $($ggml.Count) ggml DLL(s) + Vulkan loader; $($published.Count) dir(s) published to GITHUB_PATH."
      # Spec #3141 - run the `live` nextest profile, not the fast default.
      #
      # The default profile SKIPS the model-loading modules
      # (`llm_server::engine::mtp_tests` + `llm_server::engine::integration`)
      # for fast local iteration - those tests load the real 2.44 GB GGUF trio
      # and take 183-1141 s EACH. A CI runner has no models, so on CI those
      # tests take the named-skip path anyway; `live` keeps the gate's intent
      # (the full suite is enumerated and any genuine model-independent
      # regression in those modules still fails) while remaining honest about
      # what did and did not execute. See `apps/tauri/src-tauri/.config/nextest.toml`.
      - run: cargo nextest run --manifest-path apps/tauri/src-tauri/Cargo.toml --locked --profile live
      - run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --locked -- -D warnings

  # validate — THE required check; always runs so it never goes "Expected" (AC2/AC3).
  # Fail-closed: a non-success `paths` result, or any leg result other than exactly
  # `success`/`skipped`, turns this check red. `if: always()` is load-bearing — without it
  # adding `paths` to `needs` would make this job skip when the discriminator fails.
  validate:
    needs: [paths, ui-validate, rust-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          UI_RESULT: ${{ needs.ui-validate.result }}
          RUST_RESULT: ${{ needs.rust-validate.result }}
        run: |
          status=0
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "::error::paths discriminator result was '$PATHS_RESULT' (expected success) - failing closed"
            status=1
          fi
          for entry in "ui-validate=$UI_RESULT" "rust-validate=$RUST_RESULT"; do
            leg="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$leg result was '$result' (only success or skipped is accepted) - failing closed"
                status=1
                ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "All checks passed"
