# validate.yml — THE thorough merge gate. `validate` is the single required status
# check (branch protection). Per-stack gating happens at JOB level (not the workflow
# trigger) so this gate always emits a `validate` check run, never "Expected".
name: Validate
on:
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # paths — cheap discriminator (~30s) that decides which per-stack job runs (AC3).
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Expose the per-stack flags so later `needs.paths.outputs.*` conditions work.
    outputs:
      ui: ${{ steps.chk.outputs.ui }}
      rust: ${{ steps.chk.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: chk
        with:
          base: main
          # ui/rust filters UNION on a stack-touching PR; a workflow change re-validates both.
          filters: |
            ui:
              - 'apps/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'
            rust:
              - 'apps/tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/validate.yml'
              - '.github/workflows/validate-fast.yml'

  # ui-validate — thorough UI gate; NOT a required check (skipped on UI-unrelated PRs).
  ui-validate:
    needs: paths
    if: needs.paths.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --filter @fredo/ui...
      - run: pnpm --filter @fredo/ui typecheck
      - run: pnpm --filter @fredo/ui build
      - run: pnpm --filter @fredo/ui test:run

  # rust-validate — thorough Rust gate (warm-cache + nextest); NOT a required check.
  rust-validate:
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest
      - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      - run: cargo nextest run --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --locked -- -D warnings

  # validate — THE required check; always runs so it never goes "Expected" (AC2/AC3).
  validate:
    needs: [ui-validate, rust-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.ui-validate.result }}" = "failure" ] || [ "${{ needs.rust-validate.result }}" = "failure" ]; then
            exit 1
          fi
          echo "All checks passed"
