# release.yml - the one-trigger Tauri release-build + payload-gate + draft-publish
# workflow (R-4 / AC4 / AC5). Fires ONLY on an owner-approved merge/push into the
# protected `release/stable` branch (never on `main` - AC5), plus an owner
# `workflow_dispatch` re-run fallback. Builds a single Windows x64 leg.
# Windows is the only supported platform.
# Every `uses:` action is SHA-pinned (NFR-2 / repo convention).
#
# ORDER (Spec #3158 ST-4, AC5 - the artifact gate must fail closed BEFORE a draft
# can exist; Spec #3181 ST-5/ST-8 extends it with the live artifact gate):
#   0. read the version from tauri.conf.json
#   1. BUILD ONLY - tauri-apps/tauri-action carries no release input, so it makes
#      no release API call and publishes nothing
#   2. LOCATE the produced NSIS installer from the action's artifactPaths
#   3. GATE - verify-installer-payload.ps1 asserts the engine payload is INSIDE
#      the produced installer (a build log is never a substitute)
#   3d. STAGE the companion model trio (Spec #3181 ST-8) - cached on MODEL_REVISION
#      and the three manifest file names, downloaded on a miss from the pinned
#      HuggingFace URLs. The models are NEVER shipped in the installer; the
#      artifact gate's companion clause needs them on the runner.
#   3e. GATE THE ARTIFACT (Spec #3181 ST-5) - the live release-artifact gate runs
#      against the PRODUCED installer (`steps.locate.outputs.installer`): launch,
#      styling/CSP, database, companion turn, MCP-port closure, evidence.
#   3f. NEGATIVE CONTROLS (Spec #3181 ST-5) - the three fail-closed negative legs
#      (MissingDll, Csp, Database) prove the gate's controls FIRE.
#   3g. EVIDENCE (if: always()) - upload the release-gate tree, red runs included.
#   4. PUBLISH - the workflow's ONLY publish step, gated `if: success()` AFTER
#      every gate above (no other step in this file publishes anything)
#   5. CLEANUP - if the draft step itself failed, delete a leftover draft for the
#      tag so a half-published release cannot linger
name: Release
on:
  push:
    branches: ['release/stable']
  workflow_dispatch: {}          # owner manual re-run fallback (optional)

permissions:
  contents: write                # GITHUB_TOKEN needs write to create the draft Release

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022 / MSVC 14.4x), matching
          # `validate.yml`'s rust leg. `windows-latest` now ships VS 18, whose
          # STL asserts "expected Clang 22 or newer" during the engine's
          # bindgen step, so the release build would fail the same way the
          # validation build did.
          - { platform: 'windows-2022', args: '' }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # bun builds the OpenCode plugin (`apps/opencode-plugin`) invoked by
      # tauri.conf.json's beforeBuildCommand; no other workflow installs it, so the
      # release build is the only leg that needs it (F-4 / NFR-2: SHA-pinned).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Resolved to the current `stable` ref commit SHA (dtolnay updates the ref on
      # every stable Rust release); toolchain defaults to `stable` at this commit.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (resolved SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
      # Spec #3141 ST-1 - the release build compiles llama.cpp/ggml from source
      # with the SAME feature set as CI (`vulkan`, `mtmd`, `openmp`, `ggml`,
      # `dynamic-link`). That requires the identical native prerequisite the
      # `rust-validate` leg provisions, so a release build can never silently
      # differ from the validated one:
      #   * LunarG Vulkan SDK - ggml-vulkan's Windows CMake lookup hard-fails
      #     without it and `glslc` compiles the shaders.
      # Vulkan is the ONLY GPU backend: `ggml-cuda` is not compiled, so no CUDA
      # Toolkit is provisioned and no CUDA runtime is redistributed.
      # SHA-pinned (NFR-2).
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          # Same reason as the validation leg: a cache hit skips the install
          # path, so `install_runtime` never runs and there is no loader to put
          # in the payload. The Server image does not carry a loadable
          # `vulkan-1.dll`, and the staging script copies the loader into the
          # payload — without it `ggml-vulkan.dll` cannot load and the produced
          # installer ships a payload that fails at launch.
          cache: false
          install_runtime: true
      - run: pnpm install --frozen-lockfile                  # full workspace (release.yml must build the CSS/plugin too)

      # 0. Read the version once - it names the tag and is asserted against the
      #    produced installer filename so a stale artifact can never gate.
      - name: Read version from tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $configPath = 'apps/tauri/src-tauri/tauri.conf.json'
          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
            Write-Host "::error::version read failed: $configPath not found"
            exit 1
          }
          try {
            $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          } catch {
            Write-Host "::error::version read failed: $configPath is not valid JSON - $($_.Exception.Message)"
            exit 1
          }
          $version = [string]$config.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host "::error::version read failed: $configPath has no .version"
            exit 1
          }
          Write-Host "VERSION=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 1. BUILD ONLY. Per the pinned tauri-action README, an action invocation
      #    without tagName/releaseName/releaseBody/releaseDraft/releaseId/prerelease
      #    makes NO release API call. The action stays SHA-pinned as before; only
      #    its release inputs are gone.
      - name: Build installer (publishes nothing)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1 (resolved SHA)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri/src-tauri                   # Tauri project is not at repo root (tauri-action README)
          args: ${{ matrix.args }}

      # 2. LOCATE - take the newest *-setup.exe from the action's artifactPaths
      #    (a JSON array), falling back to newest-by-mtime in the NSIS bundle
      #    directory. Fails with ::error if no installer was produced.
      - name: Locate produced installer
        id: locate
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = 'apps/tauri/src-tauri/target/release/bundle/nsis'
          $bundleFiles = @()
          if (Test-Path -LiteralPath $bundleDir -PathType Container) {
            $bundleFiles = @(Get-ChildItem -LiteralPath $bundleDir -File -Filter '*-setup.exe' |
              Sort-Object LastWriteTimeUtc -Descending)
            foreach ($f in $bundleFiles) {
              Write-Host "BUNDLE_FILE=$($f.Name) bytes=$($f.Length)"
            }
            if ($bundleFiles.Count -eq 0) {
              Write-Host 'BUNDLE_FILE=<none> bytes=0'
            }
          } else {
            Write-Host "BUNDLE_DIR_MISSING=$bundleDir"
          }

          $installer = $null
          $raw = $env:ARTIFACT_PATHS
          if (-not [string]::IsNullOrWhiteSpace($raw)) {
            $parsed = $null
            try {
              $parsed = $raw | ConvertFrom-Json
            } catch {
              Write-Host "WARN: artifactPaths is not parseable JSON - $($_.Exception.Message)"
            }
            $fromAction = @()
            foreach ($candidate in @($parsed)) {
              if ($candidate -isnot [string]) { continue }
              if ($candidate -notmatch '(?i)-setup\.exe$') { continue }
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
              $fromAction += (Get-Item -LiteralPath $candidate)
            }
            if ($fromAction.Count -gt 0) {
              $installer = ($fromAction | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1).FullName
              Write-Host "ARTIFACT_PATH_HIT=$installer"
            }
          }

          if ([string]::IsNullOrWhiteSpace($installer)) {
            if ($bundleFiles.Count -gt 0) {
              $installer = $bundleFiles[0].FullName
              Write-Host "ARTIFACT_PATH_FALLBACK=$installer"
            }
          }

          if ([string]::IsNullOrWhiteSpace($installer) -or -not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Write-Host '::error::No *-setup.exe installer found in artifactPaths or the NSIS bundle directory'
            exit 1
          }

          $full = [System.IO.Path]::GetFullPath($installer)
          Write-Host "INSTALLER=$full bytes=$((Get-Item -LiteralPath $full).Length)"
          "installer=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 3. GATE - the produced ARTIFACT must contain the engine payload, and the
      #    OpenSSL-free build option must be checked in (Spec #3172 ST-4, AC5 /
      #    R-5.2). This step publishes nothing; on failure the draft step below is
      #    skipped. Order: static metadata assert -> both script self-tests ->
      #    produced-installer verification -> PAYLOAD_GATE=PASS.
      - name: Verify installer payload
        id: gate
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.locate.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 3a. STATIC ASSERT - the checked-in CMake metadata table is the SINGLE
          #     lever that disables OpenSSL for the engine build. Fail closed: an
          #     absent, unreadable, or empty manifest is a failure, never a skip.
          $manifestPath = 'apps/tauri/src-tauri/Cargo.toml'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            Write-Host "ENGINE_OPENSSL_ASSERT=FAIL manifest=$manifestPath reason=missing"
            Write-Host '::error::ENGINE_OPENSSL_NOT_DISABLED'
            exit 1
          }
          $manifestLines = @()
          try {
            $manifestLines = @(Get-Content -LiteralPath $manifestPath -ErrorAction Stop)
          } catch {
            Write-Host "ENGINE_OPENSSL_ASSERT=FAIL manifest=$manifestPath reason=unreadable"
            Write-Host "::error::ENGINE_OPENSSL_NOT_DISABLED"
            exit 1
          }
          if ($manifestLines.Count -eq 0) {
            Write-Host "ENGINE_OPENSSL_ASSERT=FAIL manifest=$manifestPath reason=empty"
            Write-Host '::error::ENGINE_OPENSSL_NOT_DISABLED'
            exit 1
          }
          $sectionName = '[package.metadata.llama-cpp-sys-4.cmake]'
          $optionLine = 'LLAMA_OPENSSL = "OFF"'
          $inSection = $false
          $sectionFound = $false
          $optionFound = $false
          foreach ($line in $manifestLines) {
            $trimmed = $line.Trim()
            if ($trimmed.StartsWith('[')) {
              $inSection = ($trimmed -eq $sectionName)
              if ($inSection) { $sectionFound = $true }
              continue
            }
            if ($inSection -and $trimmed -eq $optionLine) { $optionFound = $true }
          }
          if (-not ($sectionFound -and $optionFound)) {
            Write-Host "ENGINE_OPENSSL_ASSERT=FAIL manifest=$manifestPath section=$sectionFound option=$optionFound"
            Write-Host '::error::ENGINE_OPENSSL_NOT_DISABLED'
            exit 1
          }
          Write-Host "ENGINE_OPENSSL_ASSERT=PASS manifest=$manifestPath section=$sectionName option=$optionLine"

          # 3b. SELF-TESTS - both gate instruments must prove themselves before
          #     either is trusted against the produced artifact.
          & powershell -NoProfile -File .opencode/scripts/stage-engine-payload.ps1 -SelfTest
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::STAGE_ENGINE_PAYLOAD_SELFTEST_FAILED exit=$code"
            exit 1
          }
          & powershell -NoProfile -File .opencode/scripts/verify-installer-payload.ps1 -SelfTest
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::VERIFY_INSTALLER_PAYLOAD_SELFTEST_FAILED exit=$code"
            exit 1
          }

          # 3c. ARTIFACT VERIFICATION - the payload must be INSIDE the produced
          #     installer (a build log is never a substitute).
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER)) {
            Write-Host '::error::PAYLOAD_INCOMPLETE_IN_ARTIFACT installer path is empty'
            exit 1
          }
          $name = [System.IO.Path]::GetFileName($env:INSTALLER)
          if (-not $name.Contains($env:EXPECTED_VERSION)) {
            Write-Host "::error::INSTALLER_VERSION_MISMATCH expected=$($env:EXPECTED_VERSION) file=$name"
            exit 1
          }
          Write-Host "GATE_INSTALLER=$env:INSTALLER version=$($env:EXPECTED_VERSION)"
          & powershell -NoProfile -File .opencode/scripts/verify-installer-payload.ps1 -Installer $env:INSTALLER
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::PAYLOAD_INCOMPLETE_IN_ARTIFACT verify-installer-payload.ps1 exited $code"
            exit 1
          }
          Write-Host 'PAYLOAD_GATE=PASS'

      # 3d. COMPANION MODEL SET (Spec #3181 ST-8). The live artifact gate's
      #     companion clause (REQ-2.5) drives one turn through the produced app,
      #     so the pinned model trio must exist on the RUNNER. It is never added
      #     to the installer/payload (bundle.resources stays engine-payload only),
      #     and CI never drives the artifact's own downloader (that would test the
      #     downloader, not the artifact).
      #
      #     The cache key is derived from the SINGLE source of truth in
      #     apps/tauri/src-tauri/src/infrastructure/companion/models.rs:
      #     MODEL_REVISION (`:43`) plus the three manifest file names (`:124-162`).
      #     A revision OR name-set change therefore always misses the cache.
      - name: Derive companion model cache key
        id: model-key
        shell: pwsh
        env:
          MODELS_RS: apps/tauri/src-tauri/src/infrastructure/companion/models.rs
          MODEL_SET_JSON: .opencode/tmp/release-gate/ci/model-set.json
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:MODELS_RS -PathType Leaf)) {
            Write-Host "::error::MODEL_CACHE_KEY_DERIVE_FAILED reason=models-rs-missing path=$($env:MODELS_RS)"
            exit 1
          }
          $text = Get-Content -LiteralPath $env:MODELS_RS -Raw

          $revisionMatch = [regex]::Match($text, 'MODEL_REVISION:\s*&str\s*=\s*"([^"]+)"')
          $subdirMatch = [regex]::Match($text, 'MODEL_SUBDIR:\s*&str\s*=\s*"([^"]+)"')
          $paths = @([regex]::Matches($text, 'path:\s*"([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
          $bytes = @([regex]::Matches($text, 'expected_bytes:\s*([0-9_]+)') | ForEach-Object { $_.Groups[1].Value })
          $urls = @([regex]::Matches($text, 'https://[^"\s]+') | ForEach-Object { $_.Value })
          if (-not $revisionMatch.Success -or -not $subdirMatch.Success) {
            Write-Host '::error::MODEL_CACHE_KEY_DERIVE_FAILED reason=revision-or-subdir-not-found'
            exit 1
          }
          if ($paths.Count -ne 3 -or $bytes.Count -ne 3 -or $urls.Count -ne 3) {
            Write-Host "::error::MODEL_CACHE_KEY_DERIVE_FAILED reason=expected-3-entries paths=$($paths.Count) bytes=$($bytes.Count) urls=$($urls.Count)"
            exit 1
          }
          $revision = $revisionMatch.Groups[1].Value
          $subdir = $subdirMatch.Groups[1].Value
          $resolvedUrls = @($urls | ForEach-Object { $_.Replace('{MODEL_REVISION}', $revision) })
          $entryBytes = @($bytes | ForEach-Object { [int64]($_ -replace '_', '') })

          $files = New-Object System.Collections.ArrayList
          for ($index = 0; $index -lt 3; $index++) {
            $relativePath = $paths[$index].Replace('/', [System.IO.Path]::DirectorySeparatorChar.ToString())
            [void]$files.Add([ordered]@{
              id = @('model', 'vision', 'mtp')[$index]
              name = [System.IO.Path]::GetFileName($paths[$index])
              path = $relativePath
              url = $resolvedUrls[$index]
              bytes = [int64]$entryBytes[$index]
            })
          }

          # Cache key: revision + a digest of the three manifest file NAMES.
          $names = @($files | ForEach-Object { $_.name })
          $namesText = ($names -join "`n")
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $hash = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($namesText))
          } finally {
            $sha.Dispose()
          }
          $builder = New-Object System.Text.StringBuilder
          foreach ($byte in $hash) { [void]$builder.Append($byte.ToString('x2')) }
          $namesHash = $builder.ToString()

          $modelsRoot = Join-Path ([string]$env:USERPROFILE) 'fredo-models'
          $modelDir = Join-Path $modelsRoot $subdir
          $jsonDir = Split-Path -Parent $env:MODEL_SET_JSON
          if (-not [string]::IsNullOrWhiteSpace($jsonDir) -and -not (Test-Path -LiteralPath $jsonDir)) {
            New-Item -ItemType Directory -Path $jsonDir -Force | Out-Null
          }
          $payload = [ordered]@{
            schemaVersion = 1
            revision = $revision
            subdir = $subdir
            modelsRoot = $modelsRoot
            modelDir = $modelDir
            namesSha256 = $namesHash
            files = @($files)
          }
          $encoding = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($env:MODEL_SET_JSON, ($payload | ConvertTo-Json -Depth 6), $encoding)

          Write-Host "MODEL_REVISION=$revision"
          Write-Host "MODEL_NAMES_SHA256=$namesHash"
          Write-Host "MODEL_DIR=$modelDir"
          foreach ($file in $files) {
            Write-Host "MODEL_SET_ENTRY id=$($file.id) name=$($file.name) bytes=$($file.bytes) url=$($file.url)"
          }
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "names_sha256=$namesHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "model_dir=$modelDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore companion models (cache)
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/fredo-models
          key: fredo-models-${{ steps.model-key.outputs.revision }}-${{ steps.model-key.outputs.names_sha256 }}

      - name: Provision companion models (download on miss)
        id: model-provision
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          MODEL_SET_JSON: .opencode/tmp/release-gate/ci/model-set.json
        run: |
          $ErrorActionPreference = 'Continue'
          # Invoke-WebRequest's progress rendering costs minutes on a 2.6 GB file.
          $ProgressPreference = 'SilentlyContinue'
          $set = Get-Content -LiteralPath $env:MODEL_SET_JSON -Raw | ConvertFrom-Json
          $failed = @()
          foreach ($file in @($set.files)) {
            $target = Join-Path ([string]$set.modelDir) ([string]$file.path)
            if ((Test-Path -LiteralPath $target -PathType Leaf) -and (Get-Item -LiteralPath $target).Length -gt 0) {
              Write-Host "MODEL_ALREADY_PRESENT file=$($file.name)"
              continue
            }
            $parent = Split-Path -Parent $target
            if (-not [string]::IsNullOrWhiteSpace($parent) -and -not (Test-Path -LiteralPath $parent)) {
              New-Item -ItemType Directory -Path $parent -Force | Out-Null
            }
            $partial = $target + '.partial'
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "MODEL_DOWNLOAD file=$($file.name) attempt=$attempt url=$($file.url)"
              try {
                Invoke-WebRequest -UseBasicParsing -Uri ([string]$file.url) -OutFile $partial -TimeoutSec 1800 -ErrorAction Stop
                if ((Test-Path -LiteralPath $partial -PathType Leaf) -and (Get-Item -LiteralPath $partial).Length -gt 0) {
                  Move-Item -LiteralPath $partial -Destination $target -Force
                  $ok = $true
                  break
                }
                Write-Host "MODEL_DOWNLOAD_EMPTY file=$($file.name) attempt=$attempt"
              } catch {
                Write-Host "MODEL_DOWNLOAD_ERROR file=$($file.name) attempt=$attempt detail=$($_.Exception.Message)"
              }
              if (Test-Path -LiteralPath $partial) { Remove-Item -LiteralPath $partial -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $ok) { $failed += [string]$file.name }
          }
          if ($failed.Count -gt 0) {
            foreach ($name in $failed) {
              Write-Host "::error::MODEL_PROVISION_FAILED file=$name"
            }
            exit 1
          }
          Write-Host 'MODEL_PROVISION=PASS'

      - name: Verify companion model set
        id: model-verify
        shell: pwsh
        env:
          MODEL_SET_JSON: .opencode/tmp/release-gate/ci/model-set.json
          MODEL_CACHE_HIT: ${{ steps.model-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $set = Get-Content -LiteralPath $env:MODEL_SET_JSON -Raw | ConvertFrom-Json
          $total = [int64]0
          $missing = ''
          foreach ($file in @($set.files)) {
            $target = Join-Path ([string]$set.modelDir) ([string]$file.path)
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { $missing = [string]$file.name; break }
            $length = (Get-Item -LiteralPath $target).Length
            if ($length -le 0) { $missing = [string]$file.name; break }
            $total = $total + $length
            Write-Host "MODEL_FILE name=$($file.name) path=$target bytes=$length expected=$($file.bytes)"
          }
          if (-not [string]::IsNullOrWhiteSpace($missing)) {
            Write-Host "::error::MODEL_PROVISION_VERIFY_FAILED file=$missing"
            exit 1
          }
          $cacheState = 'miss'
          if ([string]$env:MODEL_CACHE_HIT -eq 'true') { $cacheState = 'hit' }
          Write-Host "::notice::MODEL_CACHE=$cacheState bytes=$total"
          Write-Host "MODEL_SET=PASS files=$(@($set.files).Count) bytes=$total"

      # 3e. GATE THE PRODUCED INSTALLER (Spec #3181 ST-5, AC1/AC2/AC5). This is
      #     the artifact gate itself: it launches the produced installer's app and
      #     asserts styling/CSP, the PostgreSQL profile, one companion turn, MCP
      #     port closure and the evidence set. A non-zero exit fails the job, so
      #     the draft step below (if: success()) is skipped and NO draft release
      #     and NO uploaded asset can exist (REQ-1.3).
      - name: Gate the produced installer (live assertions)
        id: artifact-gate
        shell: pwsh
        env:
          INSTALLER: ${{ steps.locate.outputs.installer }}
          OUT_DIR: .opencode/tmp/release-gate/ci
          CDP_PORT: '9333'
          WAIT_SECS: '300'
          DB_READY_SECS: '180'
          COMPANION_SECS: '600'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER)) {
            Write-Host '::error::RELEASE_GATE_FAILED exit=1'
            exit 1
          }
          Write-Host "GATE_INSTALLER=$env:INSTALLER OUT_DIR=$env:OUT_DIR CDP_PORT=$env:CDP_PORT"
          $cdpPort = [int]$env:CDP_PORT
          $waitSecs = [int]$env:WAIT_SECS
          $dbReadySecs = [int]$env:DB_READY_SECS
          $companionSecs = [int]$env:COMPANION_SECS
          & powershell -NoProfile -File .opencode/scripts/gate-release-artifact.ps1 `
              -Installer $env:INSTALLER -Mode gate -OutDir $env:OUT_DIR `
              -CdpPort $cdpPort -WaitSecs $waitSecs `
              -DbReadySecs $dbReadySecs -CompanionSecs $companionSecs
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host 'RELEASE_GATE=PASS'
            exit 0
          }
          Write-Host "::error::RELEASE_GATE_FAILED exit=$code"
          exit $code

      # 3f. NEGATIVE CONTROLS (Spec #3181 ST-5, AC3/REQ-3.5). AC3 promises the
      #     gate's controls FIRE, so the release job EXECUTES all three fail-closed
      #     demonstrations on the runner. Each leg is `-SkipCompanion` (they never
      #     need the model set, so a cache miss cannot make them vacuous). They run
      #     BEFORE the draft step; any non-reproduction fails the job.
      - name: Negative-control legs (fail-closed demonstrations)
        id: negative-controls
        shell: pwsh
        env:
          INSTALLER: ${{ steps.locate.outputs.installer }}
          OUT_DIR: .opencode/tmp/release-gate/ci
          CDP_PORT: '9333'
          WAIT_SECS: '300'
        run: |
          $ErrorActionPreference = 'Continue'
          # The three legs share the canonical OUT_DIR, so preserve the gate's own
          # receipt before a leg can rewrite the root receipt.json - the uploaded
          # evidence must still carry the canonical verdict.
          $canonical = Join-Path $env:OUT_DIR 'receipt.json'
          if (Test-Path -LiteralPath $canonical -PathType Leaf) {
            Copy-Item -LiteralPath $canonical -Destination (Join-Path $env:OUT_DIR 'receipt-gate.json') -Force
          }
          $failed = 0
          $cdpPort = [int]$env:CDP_PORT
          $waitSecs = [int]$env:WAIT_SECS

          & powershell -NoProfile -File .opencode/scripts/gate-release-artifact.ps1 -Installer $env:INSTALLER -Mode negative -Negative MissingDll -SkipCompanion -OutDir $env:OUT_DIR -CdpPort $cdpPort -WaitSecs $waitSecs
          $missingDllExit = $LASTEXITCODE
          if ($missingDllExit -ne 0) {
            Write-Host "::error::NEGATIVE_CONTROL_FAILED leg=MissingDll exit=$missingDllExit"
            $failed = 1
          }

          & powershell -NoProfile -File .opencode/scripts/gate-release-artifact.ps1 -Installer $env:INSTALLER -Mode negative -Negative Csp -SkipCompanion -OutDir $env:OUT_DIR -CdpPort $cdpPort -WaitSecs $waitSecs
          $cspExit = $LASTEXITCODE
          if ($cspExit -ne 0) {
            Write-Host "::error::NEGATIVE_CONTROL_FAILED leg=Csp exit=$cspExit"
            $failed = 1
          }

          & powershell -NoProfile -File .opencode/scripts/gate-release-artifact.ps1 -Installer $env:INSTALLER -Mode negative -Negative Database -SkipCompanion -OutDir $env:OUT_DIR -CdpPort $cdpPort -WaitSecs $waitSecs
          $databaseExit = $LASTEXITCODE
          if ($databaseExit -ne 0) {
            Write-Host "::error::NEGATIVE_CONTROL_FAILED leg=Database exit=$databaseExit"
            $failed = 1
          }

          if ($failed -ne 0) { exit 1 }
          Write-Host 'NEGATIVE_CONTROLS=PASS'

      # 3g. EVIDENCE (Spec #3181 REQ-1.4). `if: always()` so a RED run still ships
      #     gate.log, receipt.json, the extraction tree, the per-run CDP readings,
      #     the screenshots and the negative-leg evidence. SHA-pinned like every
      #     other `uses:` in this file.
      - name: Upload release-gate evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-evidence
          path: .opencode/tmp/release-gate
          if-no-files-found: warn

      # 4. PUBLISH - the workflow's ONLY publish step, AFTER the gate passed. It
      #    creates a DRAFT (never public: no --auto, no publish) so the owner
      #    reviews it before it goes public (the deliberately-reviewed gate).
      - name: Create draft release
        id: draft
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.locate.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "app-v$env:VERSION"
          Write-Host "DRAFT_TAG=$tag"
          gh release create $tag $env:INSTALLER --draft --title "Fredo v$env:VERSION" --notes "Fredo release for v$env:VERSION - see assets to download and install."
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::DRAFT_RELEASE_FAILED tag=$tag exit=$LASTEXITCODE"
            exit 1
          }

      # 5. CLEANUP - if the draft step itself failed, remove a leftover draft for
      #    the tag so a half-published release cannot linger. A gate failure never
      #    reaches here (the draft step is skipped, not failed).
      - name: Cleanup partial draft release
        if: failure() && steps.draft.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "app-v$env:VERSION"
          gh release view $tag --json tagName --jq '.tagName' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "DELETING_DRAFT=$tag"
            gh release delete $tag --yes --cleanup-tag
          } else {
            Write-Host "NO_DRAFT_TO_CLEAN=$tag"
          }
