# release.yml — the one-trigger Tauri release-build + publish workflow (R-4 / AC4).
# Fires ONLY on an owner-approved merge/push into the protected `release/stable`
# branch (never on `main` — AC5), plus an owner `workflow_dispatch` re-run fallback.
# Builds a single Windows x64 leg via tauri-action and publishes the installer to a
# GitHub Release as a DRAFT so the owner reviews it before it goes public (the
# deliberately-reviewed gate). Windows is the only supported platform.
# Every `uses:` action is SHA-pinned (NFR-2 / repo convention).
name: Release
on:
  push:
    branches: ['release/stable']
  workflow_dispatch: {}          # owner manual re-run fallback (optional)

permissions:
  contents: write                # GITHUB_TOKEN needs write to create/publish the Release

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: 'windows-latest', args: '' }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # bun builds the OpenCode plugin (`apps/opencode-plugin`) invoked by
      # tauri.conf.json's beforeBuildCommand; no other workflow installs it, so the
      # release build is the only leg that needs it (F-4 / NFR-2: SHA-pinned).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Resolved to the current `stable` ref commit SHA (dtolnay updates the ref on
      # every stable Rust release); toolchain defaults to `stable` at this commit.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (resolved SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
      # Spec #3141 ST-1 — the release build compiles llama.cpp/ggml from source
      # with the SAME feature set as CI (`cuda`, `vulkan`, `mtmd`, `openmp`,
      # `ggml`, `dynamic-link`). That requires the identical native
      # prerequisite the `rust-validate` leg provisions, so a release build can
      # never silently differ from the validated one:
      #   * CUDA Toolkit — CMake's FindCUDAToolkit plus the `CUDA_PATH` export
      #     that `apps/tauri/src-tauri/build.rs` reads for the cudart/cublas/
      #     cublasLt import libraries;
      #   * LunarG Vulkan SDK — ggml-vulkan's Windows CMake lookup hard-fails
      #     without it and `glslc` compiles the shaders.
      # Both SHA-pinned (NFR-2). Neither changes the build's artifacts' feature
      # set; they make the mandated one buildable.
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        id: cuda-toolkit
        with:
          cuda: '13.2.0'
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile                  # full workspace (release.yml must build the CSS/plugin too)
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1 (resolved SHA)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri/src-tauri                   # Tauri project is not at repo root (tauri-action README)
          tagName: app-v__VERSION__                           # __VERSION__ ← tauri.conf.json version (0.1.0)
          releaseName: 'Fredo v__VERSION__'
          releaseBody: 'Fredo release for v__VERSION__ — see assets to download and install.'
          releaseDraft: true                                 # owner reviews + publishes the draft (deliberately-reviewed gate)
          prerelease: false
          args: ${{ matrix.args }}
