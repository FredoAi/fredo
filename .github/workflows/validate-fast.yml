# validate-fast.yml — EARLY FAST SIGNAL (NON-GATING). NEVER a required check and
# NEVER aliases/short-circuits the thorough `validate` gate in validate.yml (AC2).
# Pure additive early signal (a quick green/red in ~1-3 min), never a merge-gate substitute.
name: Validate (fast, non-gating early signal)

on:
  pull_request:
    branches: [main]
    # Trigger-level `paths` is SAFE here because this check is NOT required:
    # docs-only PRs skip it entirely (zero cost) and it leaves no "Expected" check.
    paths:
      - 'apps/ui/**'
      - 'apps/tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # fast-validate — early green/red in minutes on a cheap ubuntu runner (cached).
  fast-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Checkout the repo so we can typecheck the PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Set up pnpm from the packageManager field (same pinned SHA as audit.yml).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # Node 20 with the pnpm cache keyed on pnpm-lock.yaml (the only cache today).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # Install only the @fredo/ui workspace deps (fast).
      - run: pnpm install --filter @fredo/ui...
      # Cheapest high-signal check for the most common contributor error.
      - run: pnpm --filter @fredo/ui typecheck
      # ---- OPTIONAL early Rust signal — DEFAULT OFF (runner-minute tradeoff). --
      # An ubuntu cargo check does NOT feed the Windows thorough-gate cache, so it
      # is pure extra runner-minutes. Resolve these to full commit SHAs and pin
      # toolchain: stable (matching the thorough gate) before enabling it.
      # - uses: actions-rust-lang/setup-rust-toolchain@<full-commit-sha>
      #   with:
      #     toolchain: stable
      # - uses: Swatinem/rust-cache@<full-commit-sha>
      #   with:
      #     workspaces: apps/tauri/src-tauri
      # - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
