name: Audit
on:
  schedule:
    - cron: "0 3 * * 1"        # weekly, Monday 03:00 UTC
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rustsec/audit-check@v2.0.0 is a Node 20 action; GitHub's 2025 Node 24
      # runner deprecation makes it crash with "Unexpected end of JSON input"
      # (a platform break, not an advisory finding). Run cargo-audit directly
      # (Node-free) and report advisories without wedging the merge gate — the
      # weekly schedule still surfaces them.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit
      - name: cargo audit (advisory report; non-blocking)
        continue-on-error: true
        run: cargo audit --file apps/tauri/src-tauri/Cargo.lock
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0   # resolves pnpm from packageManager field
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: pnpm audit (advisory report; non-blocking)
        continue-on-error: true
        run: pnpm audit --prod || pnpm audit
