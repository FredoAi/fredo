name: Feature request
description: Suggest an idea or improvement for Fredo
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what is missing or painful today? Is your problem related to an existing behavior?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen. Describe the behavior, not the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: true

  - type: dropdown
    id: willingness
    attributes:
      label: Willingness to contribute
      description: Would you be willing to submit a pull request for this feature?
      options:
        - "Yes — I would like to work on this"
        - "Maybe — with guidance from maintainers"
        - "No — I am only reporting the idea"
    validations:
      required: false
