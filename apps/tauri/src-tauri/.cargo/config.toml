[http]
# Windows Schannel certificate revocation checks can fail in restricted
# network environments (CRYPT_E_NO_REVOCATION_CHECK / 0x80092012).
# Disabling this allows cargo to fetch crates normally.
check-revoke = false
multiplexing = false

# Force llama.cpp's cmake build to use Release mode even in `cargo dev` builds.
# Without this, cmake-rs inherits Cargo's debug profile and compiles with
# /MDd (debug UCRT), which triggers _osfile(fh) & FOPEN assertions at runtime.
# The llama-cpp-sys-2 build.rs forwards all CMAKE_* env vars to cmake, so
# this overrides cmake-rs's default of CMAKE_BUILD_TYPE=Debug.
[env]
CMAKE_BUILD_TYPE = "Release"
CMAKE_GENERATOR = "Visual Studio 17 2022"

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/index/"
