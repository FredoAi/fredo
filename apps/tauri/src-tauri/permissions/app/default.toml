# Spec #3147 ST-1 -- the Fredo application command permission set.
#
# This is the app-manifest default permission set: the commands the applications
# Fredo ships with receive today, expressed as Tauri permissions. A capability
# (`capabilities/app-commands.json`) grants it to the built-in window class
# (`main`, `terminal`, `doom`, `app-*`), which is the ONLY way a command
# reaches a window once `build.rs` registers an app manifest.
#
# Every identifier below is `allow-<command>` autogenerated by
# `tauri_build::AppManifest::commands(...)` from
# `src/runtime/command_manifest.rs` (the two must stay in lockstep -- the
# manifest's unit test and a `build.rs` check both enforce it). Identifiers are
# slugified: underscores become dashes.
#
# This file is DELIBERATELY not a capability: it names permissions, not windows.
# Do not add a `windows` key here -- that belongs to the capability, and a
# permissive label there would hand an installed application the host surface.

[default]
description = "The application command surface every built-in Fredo window has today."
permissions = [
  "allow-subscribe-events",
  "allow-unsubscribe-events",
  "allow-stream-health",
  "allow-application-data-read",
  "allow-application-data-watch",
  "allow-application-data-unwatch",
  "allow-application-data-write",
  "allow-application-data-delete",
  "allow-application-data-declare",
  "allow-stt-list-devices",
  "allow-stt-start",
  "allow-stt-stop",
  "allow-stt-cancel",
  "allow-stt-status",
  "allow-stt-take-audio-clip",
  "allow-save-setting",
  "allow-get-setting",
  "allow-get-control-setting",
  "allow-save-control-setting",
  "allow-ingest-autostart-get",
  "allow-ingest-autostart-set",
  "allow-open-terminal-window",
  "allow-spawn-terminal-session",
  "allow-list-terminal-sessions",
  "allow-get-pty-buffer",
  "allow-write-pty-input",
  "allow-resize-pty",
  "allow-close-terminal-session",
  "allow-close-terminal-window",
  "allow-list-persisted-terminal-sessions",
  "allow-resume-terminal-session",
  "allow-delete-terminal-session-record",
  "allow-rename-terminal-session-record",
  "allow-open-app-window",
  "allow-close-app-window",
  "allow-check-cli-installations",
  "allow-install-plugin",
  "allow-get-plugin-source-path",
  "allow-check-fredo-in-path",
  "allow-add-fredo-to-path",
  "allow-check-otel-configured",
  "allow-configure-otel",
  "allow-get-setup-plan",
  "allow-check-all-setup",
  "allow-run-setup-step",
  "allow-check-model-files",
  "allow-download-model",
  "allow-check-companion-readiness",
  "allow-llm-chat",
  "allow-llm-chat-with-image",
  "allow-llm-chat-with-audio",
  "allow-start-companion-engine",
  "allow-launch-llama-server",
  "allow-stop-llama-server",
  "allow-get-llama-server-status",
  "allow-stt-audio-capability",
  "allow-llm-chat-with-skills",
  "allow-llm-chat-with-status",
  # Spec #3243 ST-8 — the in-repo order-selection lever (`order_skill_lever_take`).
  # Granted to the built-in window class only, and the command itself stays INERT
  # unless `FREDO_ORDER_SKILL_LEVER` is exactly `1`/`true`/`on` (G-469): the grant
  # is reachability, never arming. Without it the lever is a dead surface, so the
  # unarmed control cannot be read and no armed selection can be produced.
  "allow-order-skill-lever-take",
  "allow-capture-screen-region",
  # Spec #3244 ST-3 — the reusable target-capture seam (a physical-pixel rect,
  # delegated to `capture_screen_region`) and the host window-geometry read (an
  # installed app's physical client-area rectangle). Both reach the built-in
  # window class only: the installed tier's one capability grants neither.
  "allow-capture-target-region",
  "allow-installed-app-screen-rect",
  "allow-pg-supervisor-status",
  "allow-pg-server-log-tail",
  "allow-pg-config-get",
  "allow-pg-config-apply",
  "allow-pg-database-reset",
  "allow-db-connection-list",
  "allow-db-connection-test",
  "allow-db-connection-save",
  "allow-db-connection-delete",
  "allow-db-connect",
  "allow-db-disconnect",
  "allow-db-schema-list",
  "allow-db-query-execute",
  "allow-db-result-page",
  "allow-storage-engine-status",
  "allow-wireframe-save-as",
  "allow-wireframe-open-document",
  "allow-wireframe-export-png",
  "allow-application-store-ensure-table",
  "allow-application-store-insert",
  "allow-application-store-query",
  "allow-application-store-update",
  "allow-application-store-delete",
  "allow-telemetry-get-stats",
  "allow-telemetry-purge",
  "allow-telemetry-toggle",
  "allow-telemetry-metrics-toggle",
  "allow-telemetry-logging-toggle",
  "allow-telemetry-logging-set-level",
  "allow-confirm-app-open-request",
  "allow-run-open-app-cli",
  "allow-open-doom-window",
  "allow-launch-doom-runtime",
  "allow-stop-doom-runtime",
  "allow-get-doom-status",
  "allow-doom-read-state",
  "allow-doom-step",
  "allow-doom-frame-raw",
  "allow-start-doom-autoplay",
  "allow-stop-doom-autoplay",
  "allow-get-doom-autoplay-status",
  "allow-get-doom-dataset-status",
  "allow-set-doom-dataset-enabled",
  "allow-export-doom-dataset",
  "allow-get-doom-save",
  "allow-reset-doom-save",
  "allow-enter-doom-mode",
  "allow-exit-doom-mode",
  "allow-get-doom-mode-status",
  # Spec #3147 ST-2 — the installed-application install pipeline (`installed_apps`).
  "allow-installed-app-install",
  "allow-installed-apps-list",
  # Spec #3241 ST-2 — the ONE way to load a development build. Granted to the
  # BUILT-IN window class only, exactly as `installed_app_install` already is: the
  # `installed-<id>` window matches exactly ONE capability
  # (`installed-app-commands.json`), which grants only `allow-installed-app-invoke`,
  # so an installed document can never load another application and the development
  # load path is not a privilege the installed tier can reach.
  "allow-installed-app-install-development",
  # Spec #3147 ST-4 — the installed-application window lifecycle. Granted to the
  # BUILT-IN window class only: the `installed-<id>` window matches exactly ONE
  # capability (`installed-app-commands.json`), which grants only
  # `allow-installed-app-invoke`, so these lifecycle commands stay ACL-refused to
  # an installed document (Spec #3146).
  "allow-installed-app-open",
  "allow-installed-app-close",
  # Spec #3147 ST-5 — the theme transport's live leg. The producer is the MAIN
  # window's theme effect (a built-in window), so it needs this grant; the
  # `installed-<id>` window never calls it and its one capability does not grant
  # it (Spec #3146).
  "allow-installed-apps-push-theme",
  # Spec #3146 — the installed tier's ONE command. It must ALSO be granted here
  # because `every_registered_command_is_granted_to_the_built_in_windows` requires
  # every registered command to have an allow-<command> grant in this set; the
  # installed tier reaches it through `capabilities/installed-app-commands.json`
  # (windows `installed-*`), never through this set's capability.
  "allow-installed-app-invoke",
  # Spec #3146 — the per-application consent commands, called by the settings
  # pane's Allow/Revoke controls (a BUILT-IN window). Like the install pipeline's
  # commands they must be granted here because every registered command needs an
  # allow-<command> entry in this set; the `installed-<id>` window does NOT match
  # this capability, and its own one grants only `allow-installed-app-invoke`, so
  # an installed document can never consent for itself.
  "allow-installed-app-consent-grant",
  "allow-installed-app-consent-revoke",
  # Spec #3144 — the installed-application management commands, called by the
  # settings pane's Turn off / Turn on / Remove controls (a BUILT-IN window). They
  # must also be granted here because every registered command needs an
  # allow-<command> entry; the `installed-<id>` window does NOT match this
  # capability, and its own one grants only `allow-installed-app-invoke`, so an
  # installed document can never disable, enable or remove itself.
  "allow-installed-app-disable",
  "allow-installed-app-enable",
  "allow-installed-app-remove",
  # Spec #3192 ST-1 — the resident shell. Granted to the built-in window class
  # only (`open_main_window` is also the tray/second-launch seam; `quit_app` is
  # the IPC seam and is never rendered in any UI).
  "allow-open-main-window",
  "allow-quit-app",
  # Spec #3192 ST-2 — the tray's read-back command: the `main` window's presence
  # plus the REAL native menu items. Granted to the built-in window class only.
  "allow-app-lifecycle-status",
  # Spec #3206 ST-4 — Settings → Credits: the ONE outbound link hand-off. The
  # command is `https`-only and refuses before any I/O, so this grant reaches the
  # built-in window class (Settings renders in `main`) and nothing else. No
  # capability file changes: `capabilities/app-commands.json` already targets
  # `main`/`terminal`/`doom`/`app-*`.
  "allow-open-external-link",
]
