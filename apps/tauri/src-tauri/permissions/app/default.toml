  "allow-stop-doom-runtime",
  "allow-get-doom-status",
  "allow-doom-read-state",
  "allow-doom-step",
  "allow-doom-frame-raw",
  "allow-start-doom-autoplay",
  "allow-stop-doom-autoplay",
  "allow-get-doom-autoplay-status",
  "allow-get-doom-dataset-status",
  "allow-set-doom-dataset-enabled",
  "allow-export-doom-dataset",
  "allow-get-doom-save",
  "allow-reset-doom-save",
  "allow-enter-doom-mode",
  "allow-exit-doom-mode",
  "allow-get-doom-mode-status",
  # Spec #3147 ST-2 — the installed-application install pipeline (`installed_apps`).
  "allow-installed-app-install",
  "allow-installed-apps-list",
  # Spec #3147 ST-4 — the installed-application window lifecycle. Granted to the
  # BUILT-IN window class only: the `installed-<id>` window matches no capability,
  # which is what makes its command access refuse (AC-2).
  "allow-installed-app-open",
  "allow-installed-app-close",
  # Spec #3147 ST-5 — the theme transport's live leg. The producer is the MAIN
  # window's theme effect (a built-in window), so it needs this grant; the
  # `installed-<id>` window never calls it and still matches no capability.
  "allow-installed-apps-push-theme",
  # Spec #3192 ST-1 — the resident shell. Granted to the built-in window class
  # only (`open_main_window` is also the tray/second-launch seam; `quit_app` is
  # the IPC seam and is never rendered in any UI).
  "allow-open-main-window",
  "allow-quit-app",
  # Spec #3192 ST-2 — the tray's read-back command: the `main` window's presence
  # plus the REAL native menu items. Granted to the built-in window class only.
  "allow-app-lifecycle-status",
]
