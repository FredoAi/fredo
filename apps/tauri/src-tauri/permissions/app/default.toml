# Spec #3147 ST-1 -- the Fredo application command permission set.
#
# This is the app-manifest default permission set: the commands the applications
# Fredo ships with receive today, expressed as Tauri permissions. A capability
# (`capabilities/app-commands.json`) grants it to the built-in window class
# (`main`, `terminal`, `doom`, `app-*`), which is the ONLY way a command
# reaches a window once `build.rs` registers an app manifest.
#
# Every identifier below is `allow-<command>` autogenerated by
# `tauri_build::AppManifest::commands(...)` from
# `src/runtime/command_manifest.rs` (the two must stay in lockstep -- the
# manifest's unit test and a `build.rs` check both enforce it). Identifiers are
# slugified: underscores become dashes.
#
# This file is DELIBERATELY not a capability: it names permissions, not windows.
# Do not add a `windows` key here -- that belongs to the capability, and a
# permissive label there would hand an installed application the host surface.

[default]
description = "The application command surface every built-in Fredo window has today."
permissions = [
  "allow-subscribe-events",
  "allow-unsubscribe-events",
  "allow-stream-health",
  "allow-application-data-read",
  "allow-application-data-watch",
  "allow-application-data-unwatch",
  "allow-application-data-write",
  "allow-application-data-delete",
  "allow-application-data-declare",
  "allow-stt-list-devices",
  "allow-stt-start",
  "allow-stt-stop",
  "allow-stt-cancel",
  "allow-stt-status",
  "allow-stt-take-audio-clip",
  "allow-save-setting",
  "allow-get-setting",
  "allow-get-control-setting",
  "allow-save-control-setting",
  "allow-ingest-autostart-get",
  "allow-ingest-autostart-set",
  "allow-open-terminal-window",
  "allow-spawn-terminal-session",
  "allow-list-terminal-sessions",
  "allow-get-pty-buffer",
  "allow-write-pty-input",
  "allow-resize-pty",
  "allow-close-terminal-session",
  "allow-close-terminal-window",
  "allow-list-persisted-terminal-sessions",
  "allow-resume-terminal-session",
  "allow-delete-terminal-session-record",
  "allow-rename-terminal-session-record",
  "allow-open-app-window",
  "allow-close-app-window",
  "allow-check-cli-installations",
  "allow-install-plugin",
  "allow-get-plugin-source-path",
  "allow-check-fredo-in-path",
  "allow-add-fredo-to-path",
  "allow-check-otel-configured",
  "allow-configure-otel",
  "allow-get-setup-plan",
  "allow-check-all-setup",
  "allow-run-setup-step",
  "allow-check-model-files",
  "allow-download-model",
  "allow-check-companion-readiness",
  "allow-llm-chat",
  "allow-llm-chat-with-image",
  "allow-llm-chat-with-audio",
  "allow-start-companion-engine",
  "allow-launch-llama-server",
  "allow-stop-llama-server",
  "allow-get-llama-server-status",
  "allow-stt-audio-capability",
  "allow-llm-chat-with-skills",
  "allow-llm-chat-with-status",
  "allow-capture-screen-region",
  "allow-pg-supervisor-status",
  "allow-pg-server-log-tail",
  "allow-pg-config-get",
  "allow-pg-config-apply",
  "allow-pg-database-reset",
  "allow-db-connection-list",
  "allow-db-connection-test",
  "allow-db-connection-save",
  "allow-db-connection-delete",
  "allow-db-connect",
  "allow-db-disconnect",
  "allow-db-schema-list",
  "allow-db-query-execute",
  "allow-db-result-page",
  "allow-storage-engine-status",
  "allow-wireframe-save-as",
  "allow-wireframe-open-document",
  "allow-wireframe-export-png",
  "allow-application-store-ensure-table",
  "allow-application-store-insert",
  "allow-application-store-query",
  "allow-application-store-update",
  "allow-application-store-delete",
  "allow-telemetry-get-stats",
  "allow-telemetry-purge",
  "allow-telemetry-toggle",
  "allow-telemetry-metrics-toggle",
  "allow-telemetry-logging-toggle",
  "allow-telemetry-logging-set-level",
