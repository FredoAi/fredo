<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Container: full-bleed rounded tile (r = 12.5% of 16), transparent corners. -->
  <rect data-part="tile" x="0" y="0" width="16" height="16" rx="2" fill="#0c1117"/>
  <!-- Deliberate grid-aligned head-only silhouette (rim >= 1 unit at 16px). -->
  <rect data-part="rim" x="6" y="2" width="4" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="5" y="3" width="6" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="4" y="4" width="8" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="2" y="5" width="12" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="1" y="6" width="14" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="1" y="7" width="14" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="1" y="8" width="14" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="1" y="9" width="14" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="1" y="10" width="14" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="2" y="11" width="12" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="3" y="12" width="10" height="1" fill="#00D1D1"/>
  <rect data-part="rim" x="4" y="13" width="8" height="1" fill="#00D1D1"/>
  <!-- Head interior fill (#0A373C), inset 1 unit from the rim. -->
  <rect data-part="interior" x="6" y="3" width="4" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="5" y="4" width="6" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="4" y="5" width="8" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="2" y="6" width="12" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="2" y="7" width="12" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="2" y="8" width="12" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="2" y="9" width="12" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="2" y="10" width="12" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="3" y="11" width="10" height="1" fill="#0A373C"/>
  <rect data-part="interior" x="4" y="12" width="8" height="1" fill="#0A373C"/>
  <!-- Two eyes: 1 x 2 units, mirror-symmetric about x = 8. -->
  <rect data-part="eye" x="5" y="6" width="1" height="2" fill="#00D1D1"/>
  <rect data-part="eye" x="10" y="6" width="1" height="2" fill="#00D1D1"/>
</svg>
