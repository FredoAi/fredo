[package]
name = "fredo"
version = "0.1.0"
edition = "2021"
# Selects the app binary for bare `cargo run` invocations. The second `[[bin]]`
# (`doom_stub`, `required-features`-gated) still participates in `cargo run`'s
# binary disambiguation even when its feature is off, so without this key
# `tauri dev` -> `cargo run --no-default-features` errors with "could not
# determine which binary to run". Never point this at `doom_stub`.
default-run = "fredo"

[lib]
name = "fredo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "fredo"
path = "src/main.rs"

# In-repo Doom stub engine (Spec #2968 ST-8). `required-features` keeps it OUT of
# every default build and out of the Tauri bundle: it is compiled ONLY with
# `cargo build --features doom-stub`, so no stub/engine binary is ever shipped.
[[bin]]
name = "doom_stub"
path = "src/bin/doom_stub.rs"
required-features = ["doom-stub"]

# Acquisition-mode build-time switch (Spec #2978 S1). The shipped default is the
# crate `runtime-download` mode (`default = []`, no `bundled`), so the installer
# does not grow and the distribution is fetched on first run through Fredo's
# SHA-256-pinned streaming engine (`applications/pg_supervisor/acquisition.rs`).
#
# `bundled` compile-time-embeds the PostgreSQL archive into the binary (+54,048,768 B
# installer growth) and removes the first-run network fetch. It is deliberately
# NOT the default. The crate's `bundled` build-time fetch from
# `theseus-rs/postgresql-binaries` is OUTSIDE Fredo's SHA-pinned integrity surface
# unless it is replaced by a SHA-pinned resource (Spec #2978 S3 / AC4).
[features]
default = []
bundled = ["postgresql_embedded/bundled"]
# Enables the in-repo Doom stub engine binary (ST-8). NEVER enabled in a shipped
# build; used only for deterministic offline QA of the runtime lifecycle + HTTP
# round trip + error paths.
doom-stub = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
interprocess = { version = "2", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
rfd = "0.14"
kube = { version = "0.97", features = ["client", "config", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
portable-pty = "0.8"
image = "0.25"
xcap = "0.0.14"
encoding_rs = "0.8"
# OTLP receiver
tonic = { version = "0.12", features = ["transport"] }
axum = { version = "0.7", features = ["http1", "http2"] }
opentelemetry-proto = { version = "0.7", features = ["gen-tonic", "logs", "metrics", "trace", "with-serde"] }
prost = "0.13"
bytes = "1"
# Streaming SHA-256 verification for model-file acquisition (Spec #2856)
sha2 = "0.10"
# Raw-deflate decompression for the Doom acquisition's minimal ZIP reader
# (Spec #2968 ST-4): the pinned Freedoom IWAD is distributed inside a `.zip`
# and the shared download engine is a file downloader, not an archive
# extractor. `flate2` is already in the resolved dependency graph (via
# `postgresql_embedded`/`tar`), so this adds no new supply-chain surface.
flate2 = "1"
schemars = "1"
# PostgreSQL (for observability tools)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono"] }
# Managed embedded-PostgreSQL lifecycle (Spec #2974, ST-1; packaging #2978 S1).
# Acquisition mode is the crate default `runtime-download`; the `bundled` crate
# feature is wired through the `[features]` table above and deliberately NOT
# enabled by default. `settings.timeout` must always be `Some(PG_CONTROL_TIMEOUT)`
# — leaving it `None` is the #2948 ~11 h stop hang.
postgresql_embedded = { version = "0.21", features = ["tokio"] }
# Structured logging (tracing ecosystem)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Additional utilities
base64 = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
tauri-plugin-mcp-bridge = "0.12"
# Voice input — local, on-device capture (see infrastructure/voice). The
# captured clip is handed to the managed multimodal model over IPC; there is no
# native speech engine dependency.
cpal = "0.18"
# OS-keychain credential storage for the built-in Postgres client (Spec #2950,
# ST-2): Windows Credential Manager / macOS Keychain / Linux Secret Service. The
# native backend for each platform is enabled explicitly (keyring 3 ships none
# by default); only the host platform's backend is compiled. The db-client
# stores only the connection password here; no secret ever reaches the settings
# KV, logs, or an export.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# SQL statement splitting + classification for the built-in Postgres client's
# safety gates (Spec #2950, ST-4). The PostgreSQL dialect (`PostgreSqlDialect`)
# is used to classify `db_query_execute` statements as read/write/ddl/
# destructive/unknown before any server contact; no other backend dialect is
# compiled in. `std` is on by default.
sqlparser = "0.63"

[dev-dependencies]
tempfile = "3"


