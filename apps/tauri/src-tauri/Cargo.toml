[package]
name = "fredo"
version = "0.1.0"
edition = "2021"

[lib]
name = "fredo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "fredo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
interprocess = { version = "2", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
rfd = "0.14"
kube = { version = "0.97", features = ["client", "config", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
portable-pty = "0.8"
image = "0.25"
xcap = "0.0.14"
# In-process LLM inference via llama.cpp Rust bindings (mtmd = multimodal/vision)
llama-cpp-2 = { version = "0.1", features = ["mtmd"] }
encoding_rs = "0.8"
# OTLP receiver
tonic = { version = "0.12", features = ["transport"] }
axum = { version = "0.7", features = ["http1", "http2"] }
opentelemetry-proto = { version = "0.7", features = ["gen-tonic", "logs", "metrics", "trace", "with-serde"] }
prost = "0.13"
bytes = "1"
schemars = "1"
# PostgreSQL (for observability tools)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono"] }
# Structured logging (tracing ecosystem)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Additional utilities
base64 = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
tauri-plugin-mcp-bridge = "0.12"

[dev-dependencies]
tempfile = "3"


